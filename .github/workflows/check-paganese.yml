name: Controllo Paganese

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controllo:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa strumenti
        run: |
          sudo apt-get update
          sudo apt-get install -y curl grep sed

      - name: Individua API calendario LND
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "RICERCA API CALENDARIO LND"
          echo "===================================="

          URL="https://gare.lnd.it/competizione/dipartimento-interregionale?campionato=ID&giornata=2&girone=G&leg=first&stagione=2026"

          echo ""
          echo "Scarico la pagina ufficiale..."

          curl -L \
            --fail \
            --silent \
            --show-error \
            --compressed \
            -A "Mozilla/5.0" \
            "$URL" \
            -o pagina.html

          echo ""
          echo "Dimensione pagina:"
          wc -c pagina.html

          echo ""
          echo "===================================="
          echo "OCCORRENZE DI API/AS400"
          echo "===================================="

          grep -oE '.{0,250}api/as400.{0,400}' pagina.html \
            | head -20 \
            || true

          echo ""
          echo "===================================="
          echo "OCCORRENZE ORGANIZZAZIONE"
          echo "===================================="

          grep -oiE '.{0,200}organizzazione.{0,300}' pagina.html \
            | head -30 \
            || true

          echo ""
          echo "===================================="
          echo "OCCORRENZE CAMPIONATO"
          echo "===================================="

          grep -oiE '.{0,200}campionato.{0,300}' pagina.html \
            | head -30 \
            || true

          echo ""
          echo "===================================="
          echo "OCCORRENZE GIRONE"
          echo "===================================="

          grep -oiE '.{0,200}girone.{0,300}' pagina.html \
            | head -30 \
            || true

          echo ""
          echo "===================================="
          echo "URL E STRINGHE INTERESSANTI"
          echo "===================================="

          grep -Eo \
            'https?://[^"'\'' ]+|/api/[^"'\'' ]+' \
            pagina.html \
            | sort -u \
            | head -100 \
            || true

          echo ""
          echo "===================================="
          echo "FINE RICERCA"
          echo "===================================="
