name: Controllo Paganese

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controllo:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa strumenti
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Test API calendario ufficiale LND
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "TEST API CALENDARIO UFFICIALE LND"
          echo "===================================="

          API_URL="https://gare.lnd.it/api/as400/calendario/21/ID/G/2026/2027"

          echo ""
          echo "API controllata:"
          echo "$API_URL"

          echo ""
          echo "Scarico i dati..."

          HTTP_CODE=$(curl \
            -L \
            --silent \
            --show-error \
            --compressed \
            -A "Mozilla/5.0" \
            -w "%{http_code}" \
            "$API_URL" \
            -o calendario.json)

          echo ""
          echo "Codice HTTP:"
          echo "$HTTP_CODE"

          echo ""
          echo "Dimensione risposta:"
          wc -c calendario.json

          echo ""
          echo "===================================="
          echo "PRIMI 3000 CARATTERI DELLA RISPOSTA"
          echo "===================================="

          head -c 3000 calendario.json
          echo ""

          echo ""
          echo "===================================="
          echo "VERIFICA JSON"
          echo "===================================="

          if jq empty calendario.json 2>/dev/null; then
            echo "La risposta è un JSON valido."
          else
            echo "La risposta NON è un JSON valido."
          fi

          echo ""
          echo "===================================="
          echo "STRUTTURA JSON"
          echo "===================================="

          jq 'type' calendario.json 2>/dev/null || true

          echo ""
          echo "===================================="
          echo "CHIAVI PRINCIPALI"
          echo "===================================="

          jq 'keys' calendario.json 2>/dev/null || true

          echo ""
          echo "===================================="
          echo "RICERCA PAGANESE"
          echo "===================================="

          grep -ioE '.{0,250}paganese.{0,500}' calendario.json \
            | head -20 \
            || true

          echo ""
          echo "===================================="
          echo "RICERCA SASSARI"
          echo "===================================="

          grep -ioE '.{0,250}sassari.{0,500}' calendario.json \
            | head -20 \
            || true

          echo ""
          echo "===================================="
          echo "FINE TEST"
          echo "===================================="
