name: Studio calendario completo LND

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  aggiorna-calendario:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Estrai calendario LND e genera ICS
        run: |
          cat > estrai_calendario.py <<'PYTHON'
          import json
          import re
          import urllib.request
          from datetime import datetime, timedelta
          from pathlib import Path

          BASE_URL = (
              "https://gare.lnd.it/competizione/"
              "dipartimento-interregionale"
              "?campionato=ID"
              "&giornata={giornata}"
              "&girone=G"
              "&leg={leg}"
              "&stagione=2026"
          )

          def scarica_pagina(url):
              richiesta = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": (
                          "Mozilla/5.0 "
                          "(X11; Linux x86_64) "
                          "AppleWebKit/537.36 "
                          "Chrome/131 Safari/537.36"
                      )
                  },
              )

              with urllib.request.urlopen(
                  richiesta,
                  timeout=30
              ) as risposta:
                  return risposta.read().decode(
                      "utf-8",
                      errors="replace"
                  )

          def estrai_partite(html):
              pattern = re.compile(
                  r'"matches"\s*:\s*(\[[\s\S]*?\])\s*[,}]'
              )

              for script in re.findall(
                  r"<script[^>]*>([\s\S]*?)</script>",
                  html,
                  flags=re.IGNORECASE,
              ):
                  if '"matches"' not in script:
                      continue

                  match = pattern.search(script)

                  if not match:
                      continue

                  try:
                      partite = json.loads(match.group(1))

                      if isinstance(partite, list):
                          return partite

                  except json.JSONDecodeError:
                      continue

              return []

          def valore(partita, *chiavi):
              for chiave in chiavi:
                  if chiave in partita:
                      return partita[chiave]

              return ""

          def normalizza(testo):
              return re.sub(
                  r"\s+",
                  " ",
                  str(testo or "").strip().lower()
              )

          def estrai_nome(valore_originale):
              if isinstance(valore_originale, str):
                  return valore_originale.strip()

              if isinstance(valore_originale, dict):
                  for chiave in (
                      "name",
                      "nome",
                      "team_name",
                      "teamName",
                      "club_name",
                      "clubName",
                      "denominazione",
                      "description",
                  ):
                      if valore_originale.get(chiave):
                          return str(
                              valore_originale[chiave]
                          ).strip()

              return str(valore_originale or "").strip()

          def nome_squadra(partita, lato):
              if lato == "casa":
                  chiavi = (
                      "home",
                      "home_team",
                      "homeTeam",
                      "squadra_casa",
                      "squadraCasa",
                      "team_home",
                      "teamHome",
                      "local",
                      "localTeam",
                  )
              else:
                  chiavi = (
                      "away",
                      "away_team",
                      "awayTeam",
                      "squadra_trasferta",
                      "squadraTrasferta",
                      "team_away",
                      "teamAway",
                      "visitor",
                      "visitorTeam",
                      "ospite",
                  )

              risultato = valore(partita, *chiavi)

              return estrai_nome(risultato)

          def nome_leggibile(nome):
              """
              Trasforma i nomi maiuscoli provenienti da LND
              in una forma più leggibile.
              """

              nome = re.sub(
                  r"\s+",
                  " ",
                  str(nome or "").strip()
              )

              if not nome:
                  return ""

              parole = []

              for parola in nome.split(" "):
                  # Mantiene correttamente abbreviazioni come
                  # A.S.D., C.O.S., SSD e simili.
                  if re.fullmatch(
                      r"(?:[A-Za-z]\.){2,}",
                      parola
                  ):
                      parole.append(parola.upper())
                      continue

                  if parola.upper() in {
                      "SSD",
                      "ASD",
                      "SRL",
                      "A.R.L.",
                      "S.S.D.",
                  }:
                      parole.append(parola.upper())
                      continue

                  # Gestione di parole con apostrofo o trattino.
                  parti = re.split(
                      r"([\'\-])",
                      parola.lower()
                  )

                  parola_formattata = ""

                  for parte in parti:
                      if parte in {"'", "-"}:
                          parola_formattata += parte
                      elif parte:
                          parola_formattata += (
                              parte[0].upper()
                              + parte[1:]
                          )

                  parole.append(parola_formattata)

              return " ".join(parole)

          def partita_paganese(partita):
              casa = normalizza(
                  nome_squadra(partita, "casa")
              )

              trasferta = normalizza(
                  nome_squadra(partita, "trasferta")
              )

              return (
                  "paganese" in casa
                  or "paganese" in trasferta
              )

          def id_partita(partita):
              return str(
                  valore(
                      partita,
                      "id",
                      "match_id",
                      "matchId",
                      "gara_id",
                      "garaId",
                  )
                  or ""
              )

          def chiave_univoca(partita):
              identificativo = id_partita(partita)

              if identificativo:
                  return f"id:{identificativo}"

              casa = nome_squadra(partita, "casa")
              trasferta = nome_squadra(partita, "trasferta")

              data_ora = trova_data_ora(partita)

              return (
                  f"fallback:"
                  f"{normalizza(data_ora)}|"
                  f"{normalizza(casa)}|"
                  f"{normalizza(trasferta)}"
              )

          def raccogli_stringhe(valore_originale, percorso=""):
              """
              Cerca ricorsivamente tutte le stringhe presenti
              nell'oggetto partita.
              """

              risultati = []

              if isinstance(valore_originale, dict):
                  for chiave, valore_corrente in valore_originale.items():
                      nuovo_percorso = (
                          f"{percorso}.{chiave}"
                          if percorso
                          else str(chiave)
                      )

                      risultati.extend(
                          raccogli_stringhe(
                              valore_corrente,
                              nuovo_percorso
                          )
                      )

              elif isinstance(valore_originale, list):
                  for indice, elemento in enumerate(
                      valore_originale
                  ):
                      risultati.extend(
                          raccogli_stringhe(
                              elemento,
                              f"{percorso}[{indice}]"
                          )
                      )

              elif isinstance(valore_originale, str):
                  risultati.append(
                      (percorso, valore_originale.strip())
                  )

              return risultati

          def trova_data_ora(partita):
              """
              Cerca prima i campi che sembrano contenere data,
              orario, inizio o programmazione.

              Supporta:
              - 2026-09-06T15:00:00
              - 2026-09-06 15:00
              - 06/09/2026 15:00
              - data separata da un campo time/orario
              """

              stringhe = raccogli_stringhe(partita)

              prioritarie = []
              generiche = []

              for percorso, testo in stringhe:
                  percorso_lower = percorso.lower()

                  if any(
                      parola in percorso_lower
                      for parola in (
                          "date",
                          "data",
                          "time",
                          "ora",
                          "start",
                          "inizio",
                          "schedule",
                          "programm",
                          "datetime",
                      )
                  ):
                      prioritarie.append(testo)

                  generiche.append(testo)

              candidati = prioritarie + generiche

              # Prima cerchiamo una stringa che contenga
              # direttamente sia la data sia l'orario.
              for testo in candidati:
                  if re.search(
                      r"20\d{2}-\d{2}-\d{2}"
                      r"[T\s]+\d{1,2}:\d{2}",
                      testo
                  ):
                      return testo

                  if re.search(
                      r"\d{2}/\d{2}/20\d{2}"
                      r"\s+\d{1,2}:\d{2}",
                      testo
                  ):
                      return testo

              # Se data e orario sono separati, li ricostruiamo.
              data_trovata = None
              ora_trovata = None

              for testo in candidati:
                  if data_trovata is None:
                      if re.search(
                          r"20\d{2}-\d{2}-\d{2}",
                          testo
                      ):
                          data_trovata = testo

                      elif re.search(
                          r"\d{2}/\d{2}/20\d{2}",
                          testo
                      ):
                          data_trovata = testo

                  if ora_trovata is None:
                      match_ora = re.search(
                          r"\b([01]?\d|2[0-3]):[0-5]\d\b",
                          testo
                      )

                      if match_ora:
                          ora_trovata = match_ora.group(0)

              if data_trovata and ora_trovata:
                  return (
                      f"{data_trovata} "
                      f"{ora_trovata}"
                  )

              if data_trovata:
                  return data_trovata

              return ""

          def parse_data_ora(testo):
              """
              Restituisce una datetime.
              Se l'orario non esiste, restituisce la data
              a mezzanotte e il flag False.
              """

              testo = str(testo or "").strip()

              if not testo:
                  return None, False

              # ISO con orario:
              # 2026-09-06T15:00:00
              # 2026-09-06 15:00
              match = re.search(
                  r"(20\d{2})-(\d{2})-(\d{2})"
                  r"[T\s]+"
                  r"(\d{1,2}):(\d{2})",
                  testo
              )

              if match:
                  anno, mese, giorno, ora, minuti = map(
                      int,
                      match.groups()
                  )

                  return datetime(
                      anno,
                      mese,
                      giorno,
                      ora,
                      minuti,
                  ), True

              # Data italiana con orario:
              # 06/09/2026 15:00
              match = re.search(
                  r"(\d{2})/(\d{2})/(20\d{2})"
                  r"\s+(\d{1,2}):(\d{2})",
                  testo
              )

              if match:
                  giorno, mese, anno, ora, minuti = map(
                      int,
                      match.groups()
                  )

                  return datetime(
                      anno,
                      mese,
                      giorno,
                      ora,
                      minuti,
                  ), True

              # Data ISO senza orario.
              match = re.search(
                  r"(20\d{2})-(\d{2})-(\d{2})",
                  testo
              )

              if match:
                  anno, mese, giorno = map(
                      int,
                      match.groups()
                  )

                  return datetime(
                      anno,
                      mese,
                      giorno,
                  ), False

              # Data italiana senza orario.
              match = re.search(
                  r"(\d{2})/(\d{2})/(20\d{2})",
                  testo
              )

              if match:
                  giorno, mese, anno = map(
                      int,
                      match.groups()
                  )

                  return datetime(
                      anno,
                      mese,
                      giorno,
                  ), False

              return None, False

          def escape_ics(testo):
              testo = str(testo or "")

              return (
                  testo
                  .replace("\\", "\\\\")
                  .replace(";", "\\;")
                  .replace(",", "\\,")
                  .replace("\r\n", "\\n")
                  .replace("\n", "\\n")
                  .replace("\r", "\\n")
              )

          def crea_ics(partite):
              righe = [
                  "BEGIN:VCALENDAR",
                  "VERSION:2.0",
                  "PRODID:-//Paganese Calendar//IT",
                  "CALSCALE:GREGORIAN",
                  "METHOD:PUBLISH",
                  "X-WR-CALNAME:Paganese Calcio 1926",
                  "X-WR-TIMEZONE:Europe/Rome",
              ]

              generati = 0
              con_orario = 0
              senza_orario = 0

              for partita in partite:
                  testo_data_ora = trova_data_ora(partita)
                  data_ora, ha_orario = parse_data_ora(
                      testo_data_ora
                  )

                  casa_originale = nome_squadra(
                      partita,
                      "casa"
                  )

                  trasferta_originale = nome_squadra(
                      partita,
                      "trasferta"
                  )

                  casa = nome_leggibile(
                      casa_originale
                  )

                  trasferta = nome_leggibile(
                      trasferta_originale
                  )

                  identificativo = id_partita(partita)

                  if data_ora is None:
                      print(
                          "ATTENZIONE: data non riconosciuta "
                          f"per ID {identificativo}"
                      )
                      continue

                  if not casa:
                      casa = "Squadra di casa"

                  if not trasferta:
                      trasferta = "Squadra ospite"

                  if identificativo:
                      uid = (
                          f"{identificativo}"
                          "@paganese-calendar.github"
                      )
                  else:
                      uid = (
                          f"{data_ora.strftime('%Y%m%d')}-"
                          f"{normalizza(casa)}-"
                          f"{normalizza(trasferta)}"
                          "@paganese-calendar.github"
                      )

                  titolo = f"{casa} - {trasferta}"

                  descrizione = (
                      f"{titolo}\\n"
                      "Calendario Paganese Calcio 1926"
                  )

                  righe.extend([
                      "BEGIN:VEVENT",
                      f"UID:{escape_ics(uid)}",
                      (
                          "DTSTAMP:"
                          f"{datetime.utcnow().strftime('%Y%m%dT%H%M%SZ')}"
                      ),
                  ])

                  if ha_orario:
                      inizio = data_ora.strftime(
                          "%Y%m%dT%H%M%S"
                      )

                      fine = (
                          data_ora + timedelta(hours=2)
                      ).strftime(
                          "%Y%m%dT%H%M%S"
                      )

                      righe.extend([
                          f"DTSTART;TZID=Europe/Rome:{inizio}",
                          f"DTEND;TZID=Europe/Rome:{fine}",
                      ])

                      con_orario += 1

                  else:
                      giorno_inizio = data_ora.strftime(
                          "%Y%m%d"
                      )

                      giorno_fine = (
                          data_ora + timedelta(days=1)
                      ).strftime(
                          "%Y%m%d"
                      )

                      righe.extend([
                          f"DTSTART;VALUE=DATE:{giorno_inizio}",
                          f"DTEND;VALUE=DATE:{giorno_fine}",
                      ])

                      senza_orario += 1

                  righe.extend([
                      f"SUMMARY:{escape_ics(titolo)}",
                      f"DESCRIPTION:{escape_ics(descrizione)}",
                      "STATUS:CONFIRMED",
                      "TRANSP:TRANSPARENT",
                      "END:VEVENT",
                  ])

                  generati += 1

                  print(
                      f"ICS: {titolo} | "
                      f"{testo_data_ora} | "
                      f"Orario: {'SI' if ha_orario else 'NO'}"
                  )

              righe.append("END:VCALENDAR")

              return (
                  "\r\n".join(righe) + "\r\n",
                  generati,
                  con_orario,
                  senza_orario,
              )

          tutte_le_partite = {}

          configurazioni = [
              ("andata", "first"),
              ("ritorno", "second"),
          ]

          for nome_leg, valore_leg in configurazioni:
              print("")
              print("=" * 70)
              print(
                  f"LETTURA {nome_leg.upper()} "
                  f"- parametro leg={valore_leg}"
              )
              print("=" * 70)

              for giornata in range(1, 18):
                  url = BASE_URL.format(
                      giornata=giornata,
                      leg=valore_leg,
                  )

                  try:
                      html = scarica_pagina(url)
                      partite = estrai_partite(html)

                      print(
                          f"{nome_leg.capitalize()} "
                          f"giornata {giornata}: "
                          f"partite trovate = {len(partite)}"
                      )

                      nuove = 0
                      duplicate = 0

                      for partita in partite:
                          chiave = chiave_univoca(partita)

                          if chiave in tutte_le_partite:
                              duplicate += 1
                              continue

                          partita["_leg"] = nome_leg
                          partita["_giornata_pagina"] = giornata

                          tutte_le_partite[chiave] = partita
                          nuove += 1

                      print(
                          f"  Nuove: {nuove} | "
                          f"Duplicate: {duplicate}"
                      )

                  except Exception as errore:
                      print(
                          f"ERRORE {nome_leg} giornata {giornata}: "
                          f"{errore}"
                      )

          partite_uniche = list(
              tutte_le_partite.values()
          )

          partite_paganese = [
              partita
              for partita in partite_uniche
              if partita_paganese(partita)
          ]

          partite_paganese.sort(
              key=lambda partita: (
                  trova_data_ora(partita),
                  id_partita(partita),
              )
          )

          print("")
          print("=" * 70)
          print("RISULTATO FINALE")
          print("=" * 70)
          print(
              f"Partite uniche raccolte: "
              f"{len(partite_uniche)}"
          )
          print(
              f"Partite Paganese: "
              f"{len(partite_paganese)}"
          )
          print("")

          for indice, partita in enumerate(
              partite_paganese,
              start=1
          ):
              print(
                  f"{indice:02d}. "
                  f"{trova_data_ora(partita)} | "
                  f"{nome_leggibile(nome_squadra(partita, 'casa'))} - "
                  f"{nome_leggibile(nome_squadra(partita, 'trasferta'))} | "
                  f"ID: {id_partita(partita)} | "
                  f"Pagina: {partita.get('_leg')} "
                  f"{partita.get('_giornata_pagina')}"
              )

          Path("partite_lnd.json").write_text(
              json.dumps(
                  partite_uniche,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          Path("partite_paganese.json").write_text(
              json.dumps(
                  partite_paganese,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          calendario_ics, eventi_generati, con_orario, senza_orario = crea_ics(
              partite_paganese
          )

          Path("paganese.ics").write_text(
              calendario_ics,
              encoding="utf-8",
              newline="",
          )

          print("")
          print("=" * 70)
          print("GENERAZIONE CALENDARIO ICS")
          print("=" * 70)
          print(
              f"Eventi ICS generati: {eventi_generati}"
          )
          print(
              f"Eventi con orario: {con_orario}"
          )
          print(
              f"Eventi senza orario: {senza_orario}"
          )

          if len(partite_paganese) != 34:
              print("")
              print(
                  "ATTENZIONE: il numero di partite Paganese "
                  f"è {len(partite_paganese)}, non 34."
              )

          elif eventi_generati != 34:
              print("")
              print(
                  "ATTENZIONE: sono state trovate 34 partite, "
                  f"ma generati soltanto {eventi_generati} eventi ICS."
              )

          else:
              print("")
              print(
                  "OK: trovate 34 partite Paganese "
                  "e generati 34 eventi ICS."
              )
          PYTHON

          python estrai_calendario.py

      - name: Controlla file generati
        run: |
          echo "File generati:"
          ls -lah \
            partite_lnd.json \
            partite_paganese.json \
            paganese.ics

          echo ""
          echo "Eventi con DTSTART:"
          grep -E "^DTSTART" paganese.ics || true

      - name: Commit dei risultati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            partite_lnd.json \
            partite_paganese.json \
            paganese.ics

          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Aggiorna calendario Paganese"
            git push
          fi
