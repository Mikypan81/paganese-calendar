name: Controllo Paganese

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controllo:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa strumenti
        run: |
          sudo apt-get update
          sudo apt-get install -y curl grep sed

      - name: Studia pagina ufficiale LND
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "STUDIO PAGINA UFFICIALE LND"
          echo "===================================="

          URL="https://gare.lnd.it/competizione/dipartimento-interregionale?campionato=ID&giornata=2&girone=G&leg=first&stagione=2026"

          echo ""
          echo "URL controllato:"
          echo "$URL"

          echo ""
          echo "Scarico la pagina..."

          curl -L \
            --fail \
            --silent \
            --show-error \
            --compressed \
            -A "Mozilla/5.0" \
            "$URL" \
            -o pagina.html

          echo ""
          echo "Dimensione pagina:"
          wc -c pagina.html

          echo ""
          echo "===================================="
          echo "PRIME 80 RIGHE DELLA PAGINA"
          echo "===================================="

          sed -n '1,80p' pagina.html

          echo ""
          echo "===================================="
          echo "RICERCA PAGANESE"
          echo "===================================="

          grep -in "paganese" pagina.html || true

          echo ""
          echo "===================================="
          echo "RICERCA SASSARI"
          echo "===================================="

          grep -in "sassari" pagina.html || true

          echo ""
          echo "===================================="
          echo "RICERCA PAROLE API / JSON"
          echo "===================================="

          grep -Eoi \
            'https?[^"'\'' ]+|/[^"'\'' ]*(api|json)[^"'\'' ]*' \
            pagina.html \
            | head -100 \
            || true

          echo ""
          echo "===================================="
          echo "SCRIPT JAVASCRIPT PRESENTI"
          echo "===================================="

          grep -Eoi \
            '<script[^>]+src="[^"]+"' \
            pagina.html \
            | head -100 \
            || true

          echo ""
          echo "===================================="
          echo "FINE STUDIO"
          echo "===================================="
