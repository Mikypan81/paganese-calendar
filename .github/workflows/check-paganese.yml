name: Controllo Paganese

on:
  workflow_dispatch:

  schedule:
    - cron: "0 7 * * *"

jobs:
  controllo:
    runs-on: ubuntu-latest

    steps:

      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa strumenti
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lynx poppler-utils

      - name: Cerca variazioni delle partite di campionato
        run: |
          echo "======================================"
          echo "CONTROLLO AUTOMATICO PAGANESE"
          echo "======================================"
          date

          echo ""
          echo "Leggo le partite presenti nel calendario..."

          grep "^SUMMARY:" paganese.ics || true

          echo ""
          echo "Scarico elenco comunicati Serie D..."

          lynx -dump -listonly \
            "https://lnd.it/seried/comunicati/" \
            > links.txt

          echo ""
          echo "Cerco PDF relativi a variazioni gare..."

          grep -i "variazioni.*\.pdf" links.txt \
            | sed -E 's/^[[:space:]]*[0-9]+\.[[:space:]]*//' \
            > variazioni.txt || true

          echo ""
          echo "PDF trovati:"
          cat variazioni.txt || true

          echo ""
          echo "======================================"
          echo "CONTROLLO DELLE PARTITE IN CALENDARIO"
          echo "======================================"

          python3 <<'PY'
          import re
          import subprocess
          import unicodedata
          from pathlib import Path
          from urllib.request import urlretrieve

          def normalizza(testo):
              testo = unicodedata.normalize("NFD", testo)
              testo = "".join(
                  c for c in testo
                  if unicodedata.category(c) != "Mn"
              )
              testo = testo.upper()
              testo = testo.replace("’", "'")
              testo = re.sub(r"[^A-Z0-9 ]", " ", testo)
              testo = re.sub(r"\s+", " ", testo).strip()
              return testo

          # Legge tutte le partite dal calendario ICS
          ics = Path("paganese.ics").read_text(
              encoding="utf-8",
              errors="ignore"
          )

          partite = []

          for summary in re.findall(
              r"^SUMMARY:(.+)$",
              ics,
              re.MULTILINE
          ):
              summary = summary.strip()

              if " - " not in summary:
                  continue

              casa, trasferta = summary.split(" - ", 1)

              if normalizza(casa) == "PAGANESE":
                  avversario = normalizza(trasferta)

              elif normalizza(trasferta) == "PAGANESE":
                  avversario = normalizza(casa)

              else:
                  continue

              partite.append({
                  "summary": summary,
                  "avversario": avversario
              })

          print("")
          print("PARTITE DI CAMPIONATO CARICATE:")
          print("")

          for partita in partite:
              print("-", partita["summary"])

          print("")
          print("Totale partite:", len(partite))

          # Legge gli URL dei comunicati
          urls = []

          if Path("variazioni.txt").exists():
              urls = [
                  riga.strip()
                  for riga in Path("variazioni.txt").read_text().splitlines()
                  if riga.strip()
              ]

          trovate = []

          print("")
          print("======================================")
          print("ANALISI COMUNICATI")
          print("======================================")

          for numero, url in enumerate(urls, 1):

              print("")
              print("Analizzo comunicato", numero)
              print(url)

              pdf = f"comunicato_{numero}.pdf"
              txt = f"comunicato_{numero}.txt"

              try:
                  urlretrieve(url, pdf)

                  subprocess.run(
                      [
                          "pdftotext",
                          "-layout",
                          pdf,
                          txt
                      ],
                      check=True,
                      capture_output=True
                  )

                  testo = Path(txt).read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )

              except Exception as errore:
                  print("Errore durante la lettura:", errore)
                  continue

              righe = testo.splitlines()

              trovato_in_questo_pdf = False

              for indice, riga in enumerate(righe):

                  riga_norm = normalizza(riga)

                  if "PAGANESE" not in riga_norm:
                      continue

                  for partita in partite:

                      avversario = partita["avversario"]

                      if avversario in riga_norm:

                          trovato_in_questo_pdf = True

                          risultato = {
                              "partita": partita["summary"],
                              "url": url,
                              "indice": indice,
                              "righe": righe
                          }

                          trovate.append(risultato)

                          print("")
                          print("🚨🚨🚨 POSSIBILE VARIAZIONE 🚨🚨🚨")
                          print("PARTITA:", partita["summary"])
                          print("FONTE:", url)
                          print("")
                          print("CONTESTO:")

                          inizio = max(0, indice - 4)
                          fine = min(len(righe), indice + 8)

                          for riga_contesto in righe[inizio:fine]:
                              print(riga_contesto)

                          print("")
                          print("--------------------------------------")

              if not trovato_in_questo_pdf:
                  print("Nessuna partita del calendario trovata.")

          print("")
          print("======================================")
          print("RISULTATO FINALE")
          print("======================================")

          if trovate:

              print("")
              print("🚨 TROVATE POSSIBILI VARIAZIONI!")
              print("")

              for risultato in trovate:
                  print("-", risultato["partita"])

          else:

              print("")
              print("✅ Nessuna variazione relativa alle")
              print("partite attualmente presenti nel")
              print("calendario Paganese.")

          print("")
          print("======================================")
          PY
