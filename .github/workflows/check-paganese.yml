name: Controllo Paganese

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  controllo:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================

      - name: Scarica repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALLAZIONE STRUMENTI
      # ============================================================

      - name: Installa strumenti
        run: |
          sudo apt-get update
          sudo apt-get install -y lynx poppler-utils


      # ============================================================
      # 3. CONTROLLO E AGGIORNAMENTO
      # ============================================================

      - name: Controlla e aggiorna calendario Paganese
        shell: bash
        run: |

          set -e

          echo "===================================="
          echo "CONTROLLO AUTOMATICO PAGANESE"
          echo "===================================="
          date -u


          # ========================================================
          # 4. SCARICA ELENCO COMUNICATI
          # ========================================================

          echo ""
          echo "Scarico elenco comunicati Serie D..."

          lynx -dump -listonly \
            "https://comunicati.lnd.it/pages/comunicati?categoria=Interregionale" \
            > links.txt 2>/dev/null || true


          echo ""
          echo "Cerco PDF relativi a variazioni gare..."

          grep -i "variazioni.*\.pdf" links.txt \
            | sed -E 's/^[[:space:]]*[0-9]+\.[[:space:]]*//' \
            > variazioni.txt || true


          echo ""
          echo "PDF trovati:"

          cat variazioni.txt || true


          # ========================================================
          # 5. CONTROLLO CALENDARIO
          # ========================================================

          if [ ! -f "paganese.ics" ]; then
            echo ""
            echo "❌ ERRORE: paganese.ics non trovato."
            exit 1
          fi


          # ========================================================
          # 6. SCRIPT PYTHON
          # ========================================================

          python3 <<'PY'

          import re
          import subprocess
          import unicodedata
          from datetime import datetime, date


          ICS_FILE = "paganese.ics"


          print("")
          print("====================================")
          print("LETTURA CALENDARIO PAGANESE")
          print("====================================")


          # ========================================================
          # NORMALIZZAZIONE
          # ========================================================

          def normalize(text):

              text = unicodedata.normalize("NFKD", text)

              text = "".join(
                  c for c in text
                  if not unicodedata.combining(c)
              )

              text = text.upper()

              text = text.replace("–", "-")
              text = text.replace("—", "-")
              text = text.replace("’", "'")

              text = re.sub(
                  r"[^A-Z0-9]+",
                  " ",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          # ========================================================
          # LETTURA ICS
          # ========================================================

          with open(
              ICS_FILE,
              "r",
              encoding="utf-8"
          ) as f:
              ics_text = f.read()


          # Unfolding standard ICS
          ics_unfolded = re.sub(
              r"\r?\n[ \t]",
              "",
              ics_text
          )


          events = re.findall(
              r"BEGIN:VEVENT(.*?)END:VEVENT",
              ics_unfolded,
              flags=re.S
          )


          partite = []


          # ========================================================
          # ESTRAZIONE EVENTI
          # ========================================================

          for event in events:

              summary_match = re.search(
                  r"^SUMMARY:(.*)$",
                  event,
                  flags=re.M
              )

              dtstart_match = re.search(
                  r"^DTSTART(?:;[^:]*)?:(\d{8}T\d{4,6})(?:Z)?$",
                  event,
                  flags=re.M
              )

              dtend_match = re.search(
                  r"^DTEND(?:;[^:]*)?:(\d{8}T\d{4,6})(?:Z)?$",
                  event,
                  flags=re.M
              )

              if not summary_match:
                  continue

              if not dtstart_match:
                  continue


              summary = summary_match.group(1).strip()

              dtstart_raw = dtstart_match.group(1)


              if len(dtstart_raw) == 13:

                  dtstart = datetime.strptime(
                      dtstart_raw,
                      "%Y%m%dT%H%M"
                  )

              else:

                  dtstart = datetime.strptime(
                      dtstart_raw,
                      "%Y%m%dT%H%M%S"
                  )


              # ====================================================
              # CASA / TRASFERTA
              # ====================================================

              summary_norm = normalize(summary)


              if summary_norm.startswith("PAGANESE "):

                  ruolo = "CASA"

                  avversario = re.sub(
                      r"^Paganese\s*-\s*",
                      "",
                      summary,
                      flags=re.I
                  ).strip()


              elif summary_norm.endswith(" PAGANESE"):

                  ruolo = "TRASFERTA"

                  avversario = re.sub(
                      r"\s*-\s*Paganese\s*$",
                      "",
                      summary,
                      flags=re.I
                  ).strip()


              else:

                  continue


              partite.append({
                  "summary": summary,
                  "avversario": avversario,
                  "avversario_norm": normalize(avversario),
                  "ruolo": ruolo,
                  "dtstart": dtstart,
                  "dtstart_raw": dtstart_raw,
                  "dtend_match": dtend_match,
                  "event": event
              })


          print("")
          print(f"PARTITE CARICATE: {len(partite)}")
          print("")


          if len(partite) != 34:

              print(
                  f"❌ ERRORE: attese 34 partite, "
                  f"trovate {len(partite)}"
              )

              exit(1)


          for p in partite:

              print(
                  f"- "
                  f"{p['dtstart'].strftime('%d/%m/%Y %H:%M')} | "
                  f"{p['summary']} | "
                  f"{p['ruolo']}"
              )


          # ========================================================
          # REGEX DATA / ORARIO
          # ========================================================

          date_pattern = re.compile(
              r"(?:"
              r"LUNEDI|LUNEDÌ|"
              r"MARTEDI|MARTEDÌ|"
              r"MERCOLEDI|MERCOLEDÌ|"
              r"GIOVEDI|GIOVEDÌ|"
              r"VENERDI|VENERDÌ|"
              r"SABATO|DOMENICA"
              r")"
              r"\s+"
              r"(\d{1,2})/(\d{1,2})/(\d{2,4})",
              re.I
          )


          time_pattern = re.compile(
              r"\b(?:ORE|ORA)\s+(\d{1,2})[,.](\d{2})",
              re.I
          )


          # ========================================================
          # DATA SENZA GIORNO DELLA SETTIMANA
          # Serve per intestazioni tipo:
          #
          # Gare del 6 settembre 2026
          # ========================================================

          month_pattern = re.compile(
              r"\b(\d{1,2})\s+"
              r"(GENNAIO|FEBBRAIO|MARZO|APRILE|MAGGIO|GIUGNO|"
              r"LUGLIO|AGOSTO|SETTEMBRE|OTTOBRE|NOVEMBRE|DICEMBRE)"
              r"(?:\s+(\d{4}))?",
              re.I
          )


          mesi = {
              "GENNAIO": 1,
              "FEBBRAIO": 2,
              "MARZO": 3,
              "APRILE": 4,
              "MAGGIO": 5,
              "GIUGNO": 6,
              "LUGLIO": 7,
              "AGOSTO": 8,
              "SETTEMBRE": 9,
              "OTTOBRE": 10,
              "NOVEMBRE": 11,
              "DICEMBRE": 12
          }


          def parse_numeric_date(match):

              day = int(match.group(1))
              month = int(match.group(2))
              year = int(match.group(3))

              if year < 100:
                  year += 2000

              return date(
                  year,
                  month,
                  day
              )


          def parse_text_date(match, default_year=2026):

              day = int(match.group(1))

              month_name = (
                  match.group(2)
                  .upper()
                  .replace("Ì", "I")
              )

              year_text = match.group(3)

              if year_text:
                  year = int(year_text)
              else:
                  year = default_year

              return date(
                  year,
                  mesi[month_name],
                  day
              )


          # ========================================================
          # TROVA DATA DI RIFERIMENTO DEL COMUNICATO
          # ========================================================

          def find_reference_date(lines, start_index):

              # Cerchiamo all'indietro una intestazione tipo:
              #
              # Gare del 6 settembre 2026
              #
              # oppure una data numerica.

              limite = max(
                  0,
                  start_index - 80
              )


              for k in range(
                  start_index - 1,
                  limite - 1,
                  -1
              ):

                  testo = lines[k]


                  match = re.search(
                      r"GARE\s+DEL\s+"
                      r"(\d{1,2})\s+"
                      r"([A-ZÀ-Ü]+)"
                      r"(?:\s+(\d{4}))?",
                      testo,
                      flags=re.I
                  )


                  if match:

                      try:

                          return parse_text_date(
                              match,
                              default_year=2026
                          )

                      except Exception:
                          pass


                  match = date_pattern.search(testo)

                  if match:

                      try:

                          return parse_numeric_date(
                              match
                          )

                      except Exception:
                          pass


              return None


          # ========================================================
          # TROVA PARTITE CANDIDATE
          # ========================================================

          def find_candidates(line):

              line_norm = normalize(line)

              if "PAGANESE" not in line_norm:
                  return []


              candidates = []


              for p in partite:

                  if p["avversario_norm"] in line_norm:

                      candidates.append(p)


              return candidates


          # ========================================================
          # SCARICA PDF
          # ========================================================

          with open(
              "variazioni.txt",
              "r",
              encoding="utf-8"
          ) as f:

              pdf_urls = [
                  line.strip()
                  for line in f
                  if line.strip().startswith("http")
              ]


          print("")
          print("====================================")
          print(
              f"COMUNICATI DA ANALIZZARE: "
              f"{len(pdf_urls)}"
          )
          print("====================================")


          variazioni_trovate = []


          # ========================================================
          # ANALISI COMUNICATI
          # ========================================================

          for index, url in enumerate(
              pdf_urls,
              start=1
          ):

              print("")
              print("####################################")
              print(
                  f"ANALISI COMUNICATO {index}"
              )
              print("####################################")
              print(url)


              pdf_file = f"comunicato_{index}.pdf"
              txt_file = f"comunicato_{index}.txt"


              subprocess.run(
                  [
                      "curl",
                      "-L",
                      "-s",
                      "-o",
                      pdf_file,
                      url
                  ],
                  check=True
              )


              subprocess.run(
                  [
                      "pdftotext",
                      "-layout",
                      pdf_file,
                      txt_file
                  ],
                  check=True
              )


              with open(
                  txt_file,
                  "r",
                  encoding="utf-8",
                  errors="ignore"
              ) as f:

                  lines = f.readlines()


              # ====================================================
              # CERCA GARE PAGANESE
              # ====================================================

              for i, line in enumerate(lines):

                  line_norm = normalize(line)


                  if "PAGANESE" not in line_norm:
                      continue


                  if "GARA" not in line_norm:
                      continue


                  candidates = find_candidates(line)


                  # Nessun avversario del campionato
                  #
                  # Esempio:
                  # Paganese - Palmese
                  #
                  # viene ignorata se Palmese non è nel calendario.

                  if not candidates:
                      continue


                  # ==================================================
                  # BLOCCO DELLA GARA
                  # ==================================================

                  block_end = len(lines)


                  for j in range(
                      i + 1,
                      len(lines)
                  ):

                      if re.search(
                          r"\bGARA\s+\d+",
                          lines[j],
                          flags=re.I
                      ):

                          block_end = j
                          break


                  block = lines[
                      i:block_end
                  ]


                  block_text = "".join(block)


                  # ==================================================
                  # DATA DI RIFERIMENTO DELLA GIORNATA
                  # ==================================================

                  reference_date = find_reference_date(
                      lines,
                      i
                  )


                  # ==================================================
                  # NUOVA DATA ESPLICITA
                  # ==================================================

                  nuova_data = None


                  date_match = date_pattern.search(
                      block_text
                  )


                  if date_match:

                      try:

                          nuova_data = parse_numeric_date(
                              date_match
                          )

                      except Exception:

                          nuova_data = None


                  # ==================================================
                  # NUOVO ORARIO
                  # ==================================================

                  nuovo_orario = None


                  time_match = time_pattern.search(
                      block_text
                  )


                  if time_match:

                      ora = int(
                          time_match.group(1)
                      )

                      minuti = int(
                          time_match.group(2)
                      )


                      if (
                          0 <= ora <= 23
                          and
                          0 <= minuti <= 59
                      ):

                          nuovo_orario = (
                              ora,
                              minuti
                          )


                  # ==================================================
                  # IDENTIFICAZIONE PARTITA CORRETTA
                  # ==================================================

                  partita = None


                  # --------------------------------------------------
                  # Caso ideale:
                  # una sola partita con quell'avversario
                  # --------------------------------------------------

                  if len(candidates) == 1:

                      partita = candidates[0]


                  # --------------------------------------------------
                  # Due partite contro lo stesso avversario:
                  # usiamo la data della giornata come discriminante.
                  # --------------------------------------------------

                  else:

                      if reference_date:

                          stesso_giorno = [
                              p
                              for p in candidates
                              if p["dtstart"].date()
                              == reference_date
                          ]


                          if len(stesso_giorno) == 1:

                              partita = stesso_giorno[0]


                  # --------------------------------------------------
                  # Se non siamo sicuri, NON MODIFICHIAMO NULLA.
                  # --------------------------------------------------

                  if partita is None:

                      print("")
                      print(
                          "⚠️ PARTITA NON IDENTIFICATA "
                          "CON SUFFICIENTE SICUREZZA"
                      )

                      print(
                          "   Riga:",
                          line.strip()
                      )

                      if reference_date:

                          print(
                              "   Data riferimento:",
                              reference_date.strftime(
                                  "%d/%m/%Y"
                              )
                          )

                      print(
                          "   Il calendario NON verrà modificato."
                      )

                      continue


                  # ==================================================
                  # STAMPA DATI
                  # ==================================================

                  print("")
                  print("------------------------------------")
                  print("PARTITA IDENTIFICATA")
                  print("------------------------------------")

                  print(
                      f"ICS : {partita['summary']}"
                  )

                  print(
                      "DATA: "
                      f"{partita['dtstart'].strftime('%d/%m/%Y')}"
                  )

                  print(
                      "ORA : "
                      f"{partita['dtstart'].strftime('%H:%M')}"
                  )


                  if reference_date:

                      print(
                          "GIORNATA PDF: "
                          f"{reference_date.strftime('%d/%m/%Y')}"
                      )


                  if nuova_data:

                      print(
                          "LND DATA : "
                          f"{nuova_data.strftime('%d/%m/%Y')}"
                      )

                  else:

                      print(
                          "LND DATA : "
                          "nessuna nuova data indicata"
                      )


                  if nuovo_orario:

                      print(
                          "LND ORA  : "
                          f"{nuovo_orario[0]:02d}:"
                          f"{nuovo_orario[1]:02d}"
                      )

                  else:

                      print(
                          "LND ORA  : "
                          "nessun nuovo orario indicato"
                      )


                  # ==================================================
                  # CONFRONTO
                  # ==================================================

                  cambio_data = (
                      nuova_data is not None
                      and
                      nuova_data
                      != partita["dtstart"].date()
                  )


                  cambio_orario = (
                      nuovo_orario is not None
                      and
                      (
                          nuovo_orario[0]
                          != partita["dtstart"].hour
                          or
                          nuovo_orario[1]
                          != partita["dtstart"].minute
                      )
                  )


                  # ==================================================
                  # SE NON CAMBIA NULLA
                  # ==================================================

                  if not cambio_data and not cambio_orario:

                      print("")
                      print(
                          "✅ Nessuna modifica necessaria."
                      )

                      continue


                  # ==================================================
                  # VARIAZIONE REALE
                  # ==================================================

                  print("")
                  print(
                      "⚠️ VARIAZIONE REALE RILEVATA"
                  )


                  vecchia_data = (
                      partita["dtstart"].date()
                  )


                  vecchia_ora = (
                      partita["dtstart"].hour,
                      partita["dtstart"].minute
                  )


                  nuova_data_effettiva = (
                      nuova_data
                      if nuova_data
                      else vecchia_data
                  )


                  nuovo_orario_effettivo = (
                      nuovo_orario
                      if nuovo_orario
                      else vecchia_ora
                  )


                  nuova_dtstart = datetime(
                      nuova_data_effettiva.year,
                      nuova_data_effettiva.month,
                      nuova_data_effettiva.day,
                      nuovo_orario_effettivo[0],
                      nuovo_orario_effettivo[1],
                      partita["dtstart"].second
                  )


                  print(
                      "   DA: "
                      f"{partita['dtstart'].strftime('%d/%m/%Y %H:%M')}"
                  )

                  print(
                      "   A : "
                      f"{nuova_dtstart.strftime('%d/%m/%Y %H:%M')}"
                  )


                  variazioni_trovate.append({
                      "partita": partita,
                      "nuova_dtstart": nuova_dtstart,
                      "cambio_data": cambio_data,
                      "cambio_orario": cambio_orario
                  })


          # ========================================================
          # RISULTATO ANALISI
          # ========================================================

          print("")
          print("====================================")
          print("RISULTATO ANALISI")
          print("====================================")


          if not variazioni_trovate:

              print("")
              print(
                  "✅ Nessuna variazione da applicare."
              )

              print("")
              print(
                  "CALENDARIO NON MODIFICATO."
              )

              print("")
              print("====================================")
              print("FINE CONTROLLO")
              print("====================================")

              exit(0)


          print("")
          print(
              f"⚠️ VARIAZIONI DA APPLICARE: "
              f"{len(variazioni_trovate)}"
          )


          # ========================================================
          # MODIFICA ICS
          # ========================================================

          print("")
          print("====================================")
          print("AGGIORNAMENTO PAGANESE.ICS")
          print("====================================")


          nuovo_ics = ics_unfolded


          for v in variazioni_trovate:

              partita = v["partita"]
              nuova_dtstart = v["nuova_dtstart"]


              vecchio_event = partita["event"]


              # ----------------------------------------------------
              # Nuovo DTSTART
              # ----------------------------------------------------

              nuovo_dtstart_raw = nuova_dtstart.strftime(
                  "%Y%m%dT%H%M%S"
              )


              nuovo_event = re.sub(
                  r"^DTSTART(;[^:]*)?:\d{8}T\d{4,6}(?:Z)?$",
                  lambda m:
                      "DTSTART"
                      + (
                          m.group(1)
                          if m.group(1)
                          else ""
                      )
                      + ":"
                      + nuovo_dtstart_raw,
                  vecchio_event,
                  count=1,
                  flags=re.M
              )


              # ----------------------------------------------------
              # Aggiorna DTEND mantenendo la durata
              # ----------------------------------------------------

              dtend_match = re.search(
                  r"^DTEND(;[^:]*)?:(\d{8}T\d{4,6})(?:Z)?$",
                  vecchio_event,
                  flags=re.M
              )


              if dtend_match:

                  old_dtend_raw = dtend_match.group(2)


                  if len(old_dtend_raw) == 13:

                      old_dtend = datetime.strptime(
                          old_dtend_raw,
                          "%Y%m%dT%H%M"
                      )

                  else:

                      old_dtend = datetime.strptime(
                          old_dtend_raw,
                          "%Y%m%dT%H%M%S"
                      )


                  old_dtstart = partita["dtstart"]


                  durata = (
                      old_dtend - old_dtstart
                  )


                  nuova_dtend = (
                      nuova_dtstart + durata
                  )


                  nuovo_dtend_raw = nuova_dtend.strftime(
                      "%Y%m%dT%H%M%S"
                  )


                  nuovo_event = re.sub(
                      r"^DTEND(;[^:]*)?:\d{8}T\d{4,6}(?:Z)?$",
                      lambda m:
                          "DTEND"
                          + (
                              m.group(1)
                              if m.group(1)
                              else ""
                          )
                          + ":"
                          + nuovo_dtend_raw,
                      nuovo_event,
                      count=1,
                      flags=re.M
                  )


              # ----------------------------------------------------
              # Sostituzione evento nel calendario
              # ----------------------------------------------------

              if vecchio_event not in nuovo_ics:

                  print("")
                  print(
                      "❌ ERRORE: evento originale "
                      "non trovato nell'ICS."
                  )

                  print(
                      partita["summary"]
                  )

                  exit(1)


              nuovo_ics = nuovo_ics.replace(
                  vecchio_event,
                  nuovo_event,
                  1
              )


              print("")
              print(
                  "✅ AGGIORNATA:"
              )

              print(
                  f"   {partita['summary']}"
              )

              print(
                  "   "
                  f"{partita['dtstart'].strftime('%d/%m/%Y %H:%M')}"
                  " → "
                  f"{nuova_dtstart.strftime('%d/%m/%Y %H:%M')}"
              )


          # ========================================================
          # CONTROLLO FINALE NUMERO EVENTI
          # ========================================================

          eventi_finali = re.findall(
              r"BEGIN:VEVENT(.*?)END:VEVENT",
              nuovo_ics,
              flags=re.S
          )


          print("")
          print("====================================")
          print("VERIFICA FINALE")
          print("====================================")


          print(
              f"Eventi prima : {len(events)}"
          )

          print(
              f"Eventi dopo  : {len(eventi_finali)}"
          )


          if len(eventi_finali) != 34:

              print("")
              print(
                  "❌ ERRORE: il calendario "
                  "non contiene più 34 partite."
              )

              print(
                  "ABORT: nessuna modifica verrà salvata."
              )

              exit(1)


          # ========================================================
          # SALVATAGGIO
          # ========================================================

          with open(
              ICS_FILE,
              "w",
              encoding="utf-8",
              newline=""
          ) as f:

              f.write(
                  nuovo_ics
              )


          print("")
          print(
              "✅ paganese.ics aggiornato correttamente."
          )


          print("")
          print("====================================")
          print("AGGIORNAMENTO COMPLETATO")
          print("====================================")

          PY


      # ============================================================
      # 7. COMMIT AUTOMATICO
      # ============================================================

      - name: Salva modifiche su GitHub
        shell: bash
        run: |

          if git diff --quiet -- paganese.ics; then

            echo "Nessuna modifica da salvare."

            exit 0

          fi


          echo "Modifiche rilevate in paganese.ics."


          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add paganese.ics


          git commit \
            -m "Aggiorna calendario Paganese"


          git push


          echo ""
          echo "===================================="
          echo "CALENDARIO PUBBLICATO"
          echo "===================================="

          echo "La modifica è stata inviata a GitHub."
