name: Controllo Paganese

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controllo:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa strumenti
        run: |
          sudo apt-get update
          sudo apt-get install -y curl grep sed

      - name: Cerca autenticazione API LND
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "RICERCA AUTENTICAZIONE API LND"
          echo "===================================="

          PAGINA_URL="https://gare.lnd.it/competizione/dipartimento-interregionale?campionato=ID&giornata=2&girone=G&leg=first&stagione=2026"

          JS_URL="https://gare.lnd.it/build/assets/app-93509732.js"

          echo ""
          echo "Scarico il JavaScript ufficiale..."

          curl \
            -L \
            --fail \
            --silent \
            --show-error \
            --compressed \
            -A "Mozilla/5.0" \
            "$JS_URL" \
            -o app.js

          echo ""
          echo "Dimensione JavaScript:"
          wc -c app.js

          echo ""
          echo "===================================="
          echo "RICERCA X-API-KEY"
          echo "===================================="

          grep -oiE '.{0,250}x-api-key.{0,500}' app.js \
            | head -30 \
            || true

          echo ""
          echo "===================================="
          echo "RICERCA API_KEY"
          echo "===================================="

          grep -oiE '.{0,250}api[_-]?key.{0,500}' app.js \
            | head -30 \
            || true

          echo ""
          echo "===================================="
          echo "RICERCA APIKEY"
          echo "===================================="

          grep -oiE '.{0,250}apikey.{0,500}' app.js \
            | head -30 \
            || true

          echo ""
          echo "===================================="
          echo "RICERCA AUTHORIZATION"
          echo "===================================="

          grep -oiE '.{0,250}authorization.{0,500}' app.js \
            | head -30 \
            || true

          echo ""
          echo "===================================="
          echo "RICERCA ENDPOINT AS400"
          echo "===================================="

          grep -oiE '.{0,300}as400.{0,700}' app.js \
            | head -30 \
            || true

          echo ""
          echo "===================================="
          echo "RICERCA ENDPOINT CALENDARIO"
          echo "===================================="

          grep -oiE '.{0,300}calendario.{0,700}' app.js \
            | head -30 \
            || true

          echo ""
          echo "===================================="
          echo "RICERCA CONFIGURAZIONI"
          echo "===================================="

          grep -oiE '.{0,250}(config|token|secret|header|bearer).{0,500}' app.js \
            | head -50 \
            || true

          echo ""
          echo "===================================="
          echo "FINE RICERCA"
          echo "===================================="
