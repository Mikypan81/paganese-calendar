python3 - <<'PY'
import re
import json
from pathlib import Path

html = Path("pagina.html").read_text(encoding="utf-8", errors="ignore")

scripts = re.findall(
    r'<script[^>]*type=["\']application/json["\'][^>]*>(.*?)</script>',
    html,
    flags=re.S | re.I
)

print(f"Script JSON trovati: {len(scripts)}")

def walk(value, path="root", depth=0):
    if depth > 8:
        return

    if isinstance(value, dict):
        for key, child in value.items():
            key_path = f"{path}.{key}"

            key_lower = str(key).lower()

            if any(word in key_lower for word in [
                "match",
                "game",
                "home",
                "away",
                "date",
                "score",
                "team",
                "playday",
                "calendar"
            ]):
                print(f"CHIAVE INTERESSANTE: {key_path}")

                if isinstance(child, (dict, list)):
                    try:
                        preview = json.dumps(
                            child,
                            ensure_ascii=False,
                            indent=2
                        )
                        print(preview[:3000])
                    except Exception:
                        print(repr(child)[:3000])
                else:
                    print(repr(child)[:1000])

            walk(child, key_path, depth + 1)

    elif isinstance(value, list):
        for index, child in enumerate(value[:100]):
            walk(child, f"{path}[{index}]", depth + 1)

for index, raw in enumerate(scripts, start=1):
    print()
    print("----------------------------------------")
    print(f"SCRIPT JSON NUMERO {index}")
    print("----------------------------------------")

    try:
        data = json.loads(raw)
    except Exception as exc:
        print(f"JSON non valido: {exc}")
        continue

    if isinstance(data, dict):
        print("Chiavi principali:")
        for key in data.keys():
            print(f" - {key}")

    print()
    print("Ricerca ricorsiva delle chiavi interessanti:")
    walk(data)
