name: Studio dati pagina LND

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analisi-pagina:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa strumenti
        run: |
          sudo apt-get update
          sudo apt-get install -y curl python3

      - name: Scarica pagina ufficiale
        run: |
          set -e

          URL="https://gare.lnd.it/competizione/dipartimento-interregionale?campionato=ID&giornata=2&girone=G&leg=first&stagione=2026"

          echo "===================================="
          echo "SCARICO PAGINA UFFICIALE LND"
          echo "===================================="

          echo "URL:"
          echo "$URL"

          curl -L -sS \
            -A "Mozilla/5.0" \
            "$URL" \
            -o pagina.html

          echo
          echo "Dimensione pagina:"
          wc -c pagina.html

      - name: Cerca squadre e dati nel codice HTML
        run: |
          set -e

          echo
          echo "===================================="
          echo "RICERCA PAGANESE E SASSARI"
          echo "===================================="

          echo
          echo "--- OCCORRENZE PAGANESE ---"
          grep -oi -C 8 "paganese" pagina.html | head -200 || true

          echo
          echo "--- OCCORRENZE SASSARI ---"
          grep -oi -C 8 "sassari" pagina.html | head -200 || true

          echo
          echo "--- OCCORRENZE LATTE DOLCE ---"
          grep -oi -C 8 "latte dolce" pagina.html | head -200 || true

          echo
          echo "--- OCCORRENZE MATCHES ---"
          grep -oi -C 5 "matches" pagina.html | head -100 || true

          echo
          echo "--- OCCORRENZE MATCHDAY ---"
          grep -oi -C 5 "matchday" pagina.html | head -100 || true

      - name: Analizza script JSON incorporati
        run: |
          set -e

          echo
          echo "========================================"
          echo "ANALISI COMPLETA JSON INCORPORATI"
          echo "========================================"

          python3 - <<'PY'
          import re
          import json
          from pathlib import Path

          html = Path("pagina.html").read_text(
              encoding="utf-8",
              errors="ignore"
          )

          print(f"Numero caratteri HTML: {len(html)}")

          # Cerca tutti i blocchi script presenti nella pagina.
          # Non ci limitiamo agli script con type=application/json,
          # perché il sito potrebbe incorporare i dati in uno script
          # normale, come quello iniziale della pagina.
          scripts = re.findall(
              r"<script\b[^>]*>(.*?)</script>",
              html,
              flags=re.IGNORECASE | re.DOTALL
          )

          print(f"Script trovati: {len(scripts)}")

          def walk(value, path="root", depth=0):
              if depth > 8:
                  return

              if isinstance(value, dict):
                  for key, child in value.items():
                      key_path = f"{path}.{key}"
                      key_lower = str(key).lower()

                      if any(word in key_lower for word in [
                          "match",
                          "game",
                          "home",
                          "away",
                          "date",
                          "score",
                          "team",
                          "playday",
                          "calendar"
                      ]):
                          print()
                          print(f"CHIAVE INTERESSANTE: {key_path}")

                          if isinstance(child, (dict, list)):
                              try:
                                  preview = json.dumps(
                                      child,
                                      ensure_ascii=False,
                                      indent=2
                                  )

                                  print(preview[:5000])

                              except Exception:
                                  print(repr(child)[:5000])
                          else:
                              print(repr(child)[:1000])

                      walk(child, key_path, depth + 1)

              elif isinstance(value, list):
                  for index, child in enumerate(value[:100]):
                      walk(
                          child,
                          f"{path}[{index}]",
                          depth + 1
                      )

          parole = [
              "paganese",
              "sassari",
              "latte dolce",
              "matchday",
              "matches",
              "match",
              "home",
              "away",
              "startdate",
              "date",
              "score",
              "team",
              "calendar",
              "playday"
          ]

          script_interessanti = 0

          for indice, contenuto in enumerate(scripts, start=1):
              testo = contenuto

              # Decodifica alcune forme usate nell'HTML.
              testo = testo.replace("\\/", "/")
              testo = testo.replace("&quot;", '"')
              testo = testo.replace("&#39;", "'")
              testo = testo.replace("&amp;", "&")

              presenti = [
                  parola
                  for parola in parole
                  if parola.lower() in testo.lower()
              ]

              if not presenti:
                  continue

              script_interessanti += 1

              print()
              print("----------------------------------------")
              print(f"SCRIPT NUMERO {indice}")
              print("----------------------------------------")
              print("Parole trovate:", ", ".join(presenti))
              print("Dimensione script:", len(testo))

              # Prima prova: script JSON puro.
              try:
                  data = json.loads(testo)

                  print("JSON valido: SI")
                  print("Tipo principale:", type(data).__name__)

                  if isinstance(data, dict):
                      print("Chiavi principali:")
                      for key in data.keys():
                          print(f" - {key}")

                  print()
                  print("Ricerca ricorsiva delle chiavi interessanti:")
                  walk(data)

                  continue

              except Exception as errore:
                  print("JSON puro: NO")
                  print("Motivo:", str(errore)[:200])

              # Seconda prova: cerca un oggetto JSON dentro lo script.
              # Questo serve per script del tipo:
              # window.__INITIAL_STATE__ = {...};
              # oppure:
              # const data = {...};
              oggetti_trovati = []

              for apertura in ["{", "["]:
                  posizione = testo.find(apertura)

                  if posizione != -1:
                      oggetti_trovati.append(
                          testo[posizione:]
                      )

              json_decodificato = False

              for candidato in oggetti_trovati:
                  candidato = candidato.strip()

                  # Rimuove eventuali chiusure JavaScript comuni.
                  candidato = re.sub(
                      r";\s*$",
                      "",
                      candidato
                  )

                  try:
                      decoder = json.JSONDecoder()
                      data, posizione_finale = decoder.raw_decode(
                          candidato
                      )

                      print("JSON incorporato trovato: SI")
                      print(
                          "Caratteri JSON analizzati:",
                          posizione_finale
                      )

                      if isinstance(data, dict):
                          print("Chiavi principali:")
                          for key in data.keys():
                              print(f" - {key}")

                      print()
                      print(
                          "Ricerca ricorsiva delle chiavi interessanti:"
                      )

                      walk(data)

                      json_decodificato = True
                      break

                  except Exception:
                      continue

              if not json_decodificato:
                  print("JSON incorporato trovato: NO")

                  # Mostra il contesto delle parole più importanti.
                  testo_lower = testo.lower()

                  for parola in [
                      "paganese",
                      "sassari",
                      "matches",
                      "matchday",
                      "api/as400",
                      "api/v1"
                  ]:
                      posizione = testo_lower.find(parola.lower())

                      if posizione == -1:
                          continue

                      inizio = max(0, posizione - 500)
                      fine = min(len(testo), posizione + 1500)

                      print()
                      print("----------------------------------------")
                      print(f"CONTESTO PAROLA: {parola}")
                      print("----------------------------------------")
                      print(testo[inizio:fine])

          print()
          print("========================================")
          print(
              "SCRIPT CON DATI INTERESSANTI:",
              script_interessanti
          )
          print("========================================")
          PY

      - name: Mostra fine analisi
        run: |
          echo
          echo "========================================"
          echo "FINE ANALISI"
          echo "========================================"
