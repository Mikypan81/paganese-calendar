name: Studio calendario completo LND

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  aggiorna-calendario:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Estrai calendario LND
        run: |
          cat > estrai_calendario.py <<'PYTHON'
          import json
          import re
          import urllib.request
          from datetime import datetime
          from pathlib import Path

          BASE_URL = (
              "https://gare.lnd.it/competizione/"
              "dipartimento-interregionale"
              "?campionato=ID"
              "&giornata={giornata}"
              "&girone=G"
              "&leg={leg}"
              "&stagione=2026"
          )

          SQUADRA = "Paganese"

          def scarica_pagina(url):
              richiesta = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": (
                          "Mozilla/5.0 "
                          "(X11; Linux x86_64) "
                          "AppleWebKit/537.36 "
                          "Chrome/131 Safari/537.36"
                      )
                  },
              )

              with urllib.request.urlopen(
                  richiesta,
                  timeout=30
              ) as risposta:
                  return risposta.read().decode("utf-8", errors="replace")

          def estrai_partite(html):
              """
              Cerca nei tag script il JSON contenente:
              root.props.matches
              """

              pattern = re.compile(
                  r'"matches"\s*:\s*(\[[\s\S]*?\])\s*[,}]'
              )

              risultati = []

              for script in re.findall(
                  r"<script[^>]*>([\s\S]*?)</script>",
                  html,
                  flags=re.IGNORECASE,
              ):
                  if '"matches"' not in script:
                      continue

                  match = pattern.search(script)

                  if not match:
                      continue

                  testo_json = match.group(1)

                  try:
                      partite = json.loads(testo_json)

                      if isinstance(partite, list):
                          risultati = partite
                          break

                  except json.JSONDecodeError:
                      continue

              return risultati

          def valore(partita, *chiavi):
              for chiave in chiavi:
                  if chiave in partita:
                      return partita[chiave]

              return ""

          def normalizza(testo):
              return re.sub(
                  r"\s+",
                  " ",
                  str(testo or "").strip().lower()
              )

          def chiave_univoca(partita):
              """
              L'ID LND è il metodo più sicuro.
              Come fallback usiamo data + squadre.
              """

              identificativo = valore(
                  partita,
                  "id",
                  "match_id",
                  "matchId",
                  "gara_id",
                  "garaId",
              )

              if identificativo:
                  return f"id:{identificativo}"

              data = valore(
                  partita,
                  "date",
                  "data",
                  "match_date",
                  "matchDate",
                  "datetime",
                  "dateTime",
              )

              casa = valore(
                  partita,
                  "home",
                  "home_team",
                  "homeTeam",
                  "squadra_casa",
                  "squadraCasa",
                  "team_home",
                  "teamHome",
              )

              trasferta = valore(
                  partita,
                  "away",
                  "away_team",
                  "awayTeam",
                  "squadra_trasferta",
                  "squadraTrasferta",
                  "team_away",
                  "teamAway",
              )

              return (
                  f"fallback:"
                  f"{normalizza(data)}|"
                  f"{normalizza(casa)}|"
                  f"{normalizza(trasferta)}"
              )

          def nome_squadra(partita, lato):
              if lato == "casa":
                  chiavi = (
                      "home",
                      "home_team",
                      "homeTeam",
                      "squadra_casa",
                      "squadraCasa",
                      "team_home",
                      "teamHome",
                  )
              else:
                  chiavi = (
                      "away",
                      "away_team",
                      "awayTeam",
                      "squadra_trasferta",
                      "squadraTrasferta",
                      "team_away",
                      "teamAway",
                  )

              risultato = valore(partita, *chiavi)

              if isinstance(risultato, dict):
                  return (
                      risultato.get("name")
                      or risultato.get("nome")
                      or risultato.get("team_name")
                      or risultato.get("teamName")
                      or ""
                  )

              return str(risultato or "")

          def partita_paganese(partita):
              casa = normalizza(nome_squadra(partita, "casa"))
              trasferta = normalizza(nome_squadra(partita, "trasferta"))

              return (
                  "paganese" in casa
                  or "paganese" in trasferta
              )

          def data_partita(partita):
              data = valore(
                  partita,
                  "date",
                  "data",
                  "match_date",
                  "matchDate",
                  "datetime",
                  "dateTime",
              )

              return str(data or "")

          tutte_le_partite = {}
          statistiche = []

          # L'andata ha 17 giornate.
          # Il ritorno ha altre 17 giornate.
          configurazioni = [
              ("andata", "first"),
              ("ritorno", "second"),
          ]

          for nome_leg, valore_leg in configurazioni:
              print("")
              print("=" * 70)
              print(f"LETTURA {nome_leg.upper()} - parametro leg={valore_leg}")
              print("=" * 70)

              for giornata in range(1, 18):
                  url = BASE_URL.format(
                      giornata=giornata,
                      leg=valore_leg,
                  )

                  try:
                      html = scarica_pagina(url)
                      partite = estrai_partite(html)

                      print(
                          f"{nome_leg.capitalize()} "
                          f"giornata {giornata}: "
                          f"partite trovate = {len(partite)}"
                      )

                      nuove = 0
                      duplicate = 0

                      for partita in partite:
                          chiave = chiave_univoca(partita)

                          if chiave in tutte_le_partite:
                              duplicate += 1
                              continue

                          partita["_leg"] = nome_leg
                          partita["_giornata_pagina"] = giornata
                          tutte_le_partite[chiave] = partita
                          nuove += 1

                      statistiche.append({
                          "leg": nome_leg,
                          "giornata": giornata,
                          "partite": len(partite),
                          "nuove": nuove,
                          "duplicate": duplicate,
                      })

                      print(
                          f"  Nuove: {nuove} | "
                          f"Duplicate: {duplicate}"
                      )

                  except Exception as errore:
                      print(
                          f"ERRORE {nome_leg} giornata {giornata}: "
                          f"{errore}"
                      )

          partite_uniche = list(tutte_le_partite.values())

          partite_paganese = [
              partita
              for partita in partite_uniche
              if partita_paganese(partita)
          ]

          def chiave_ordinamento(partita):
              return (
                  data_partita(partita),
                  str(
                      valore(
                          partita,
                          "id",
                          "match_id",
                          "matchId",
                      )
                  ),
              )

          partite_paganese.sort(key=chiave_ordinamento)

          print("")
          print("=" * 70)
          print("RISULTATO FINALE")
          print("=" * 70)
          print(f"Partite uniche raccolte: {len(partite_uniche)}")
          print(f"Partite Paganese: {len(partite_paganese)}")
          print("")

          for indice, partita in enumerate(partite_paganese, start=1):
              identificativo = valore(
                  partita,
                  "id",
                  "match_id",
                  "matchId",
                  "gara_id",
                  "garaId",
              )

              casa = nome_squadra(partita, "casa")
              trasferta = nome_squadra(partita, "trasferta")
              data = data_partita(partita)

              print(
                  f"{indice:02d}. "
                  f"{data} | "
                  f"{casa} - {trasferta} | "
                  f"ID: {identificativo} | "
                  f"Pagina: {partita.get('_leg')} "
                  f"{partita.get('_giornata_pagina')}"
              )

          # Salvataggio del JSON completo per eventuali controlli futuri.
          Path("partite_lnd.json").write_text(
              json.dumps(
                  partite_uniche,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          Path("partite_paganese.json").write_text(
              json.dumps(
                  partite_paganese,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          if len(partite_paganese) != 34:
              print("")
              print(
                  "ATTENZIONE: il numero di partite Paganese "
                  f"è {len(partite_paganese)}, non 34."
              )
              print(
                  "Controllare il parametro utilizzato dal sito "
                  "per il ritorno."
              )
          else:
              print("")
              print(
                  "OK: trovate esattamente 34 partite Paganese."
              )
          PYTHON

          python estrai_calendario.py

      - name: Mostra file generati
        run: |
          echo "File generati:"
          ls -lah partite_lnd.json partite_paganese.json

      - name: Commit dei risultati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add partite_lnd.json partite_paganese.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Aggiorna calendario Paganese"
            git push
          fi
