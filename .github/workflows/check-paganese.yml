name: Controllo Paganese

on:
  workflow_dispatch:

  schedule:
    - cron: "0 7 * * *"

jobs:
  controllo:
    runs-on: ubuntu-latest

    steps:
      - name: Controlla nuovi comunicati Serie D
        run: |
          echo "======================================"
          echo "CONTROLLO AUTOMATICO PAGANESE"
          echo "======================================"
          date

          echo ""
          echo "Scarico pagina comunicati Serie D..."

          curl -L -s \
            "https://lnd.it/seried/comunicati/?competition=1" \
            -o comunicati.html

          echo ""
          echo "Cerco comunicati relativi a variazioni gare..."
          echo ""

          grep -i -B 3 -A 5 "Variazioni al programma gare" comunicati.html || true

          echo ""
          echo "======================================"
          echo "CONTROLLO COMPLETATO"
          echo "======================================"
