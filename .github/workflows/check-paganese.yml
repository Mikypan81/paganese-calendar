name: Studio calendario completo LND

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analisi-calendario:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa strumenti
        run: |
          sudo apt-get update
          sudo apt-get install -y curl python3

      - name: Scarica tutte le giornate e trova la Paganese
        run: |
          set -e

          python3 - <<'PY'
          import html
          import json
          import re
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          BASE_URL = (
              "https://gare.lnd.it/competizione/"
              "dipartimento-interregionale"
              "?campionato=ID"
              "&giornata={giornata}"
              "&girone=G"
              "&leg=first"
              "&stagione=2026"
          )

          NOME_PAGANESE = "paganese"

          def scarica_pagina(url):
              richiesta = Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              with urlopen(richiesta, timeout=30) as risposta:
                  contenuto = risposta.read()

              return contenuto.decode(
                  "utf-8",
                  errors="ignore"
              )

          def pulisci_testo(testo):
              testo = html.unescape(testo)
              testo = testo.replace("\\/", "/")
              testo = testo.replace("\\u0022", '"')
              testo = testo.replace("\\u0027", "'")
              return testo

          def estrai_json_da_script(testo):
              testo = pulisci_testo(testo)
              decoder = json.JSONDecoder()

              for posizione, carattere in enumerate(testo):
                  if carattere not in "{[":
                      continue

                  candidato = testo[posizione:].strip()

                  try:
                      oggetto, caratteri_letti = decoder.raw_decode(
                          candidato
                      )
                      return oggetto

                  except Exception:
                      continue

              return None

          def cerca_matches(valore, percorso="root", profondita=0):
              risultati = []

              if profondita > 12:
                  return risultati

              if isinstance(valore, dict):
                  for chiave, contenuto in valore.items():
                      nuovo_percorso = f"{percorso}.{chiave}"

                      if str(chiave).lower() == "matches":
                          risultati.append(
                              (nuovo_percorso, contenuto)
                          )

                      risultati.extend(
                          cerca_matches(
                              contenuto,
                              nuovo_percorso,
                              profondita + 1
                          )
                      )

              elif isinstance(valore, list):
                  for indice, contenuto in enumerate(valore):
                      risultati.extend(
                          cerca_matches(
                              contenuto,
                              f"{percorso}[{indice}]",
                              profondita + 1
                          )
                      )

              return risultati

          def estrai_partite_da_html(pagina):
              scripts = re.findall(
                  r"<script\b[^>]*>(.*?)</script>",
                  pagina,
                  flags=re.IGNORECASE | re.DOTALL
              )

              for contenuto_script in scripts:
                  testo = pulisci_testo(contenuto_script)

                  parole_interessanti = [
                      "matches",
                      "paganese",
                      "sassari",
                      "matchday",
                      "calendar"
                  ]

                  if not any(
                      parola.lower() in testo.lower()
                      for parola in parole_interessanti
                  ):
                      continue

                  oggetto = estrai_json_da_script(testo)

                  if oggetto is None:
                      continue

                  risultati_matches = cerca_matches(oggetto)

                  for percorso, matches in risultati_matches:
                      if percorso == "root.props.matches":
                          if isinstance(matches, list):
                              return matches

              return []

          tutte_le_partite = []
          giornate_con_dati = 0

          print("========================================")
          print("SCARICO LE 34 GIORNATE DEL GIRONE G")
          print("========================================")

          for giornata in range(1, 35):
              url = BASE_URL.format(giornata=giornata)

              print()
              print("----------------------------------------")
              print(f"GIORNATA {giornata}")
              print("----------------------------------------")
              print(url)

              try:
                  pagina = scarica_pagina(url)
                  partite = estrai_partite_da_html(pagina)

                  print("Partite trovate:", len(partite))

                  if partite:
                      giornate_con_dati += 1

                      for partita in partite:
                          partita["giornata"] = giornata
                          tutte_le_partite.append(partita)

                  else:
                      print("ATTENZIONE: nessuna partita trovata.")

              except Exception as errore:
                  print("ERRORE:", str(errore))

              time.sleep(1)

          print()
          print("========================================")
          print("RISULTATO COMPLESSIVO")
          print("========================================")
          print("Giornate con dati:", giornate_con_dati)
          print("Partite totali raccolte:", len(tutte_le_partite))

          partite_paganese = []

          for partita in tutte_le_partite:
              casa = str(partita.get("home", ""))
              ospite = str(partita.get("away", ""))

              if (
                  NOME_PAGANESE in casa.lower()
                  or NOME_PAGANESE in ospite.lower()
              ):
                  partite_paganese.append(partita)

          partite_paganese.sort(
              key=lambda partita: (
                  partita.get("date") or "",
                  partita.get("time") or "",
                  partita.get("id") or 0
              )
          )

          print()
          print("========================================")
          print("PARTITE DELLA PAGANESE")
          print("========================================")
          print("Numero partite Paganese:", len(partite_paganese))

          for indice, partita in enumerate(
              partite_paganese,
              start=1
          ):
              print()
              print("----------------------------------------")
              print(f"PARTITA PAGANESE {indice}")
              print("----------------------------------------")

              print("ID:", partita.get("id"))
              print("Giornata:", partita.get("giornata"))
              print("Data:", partita.get("date"))
              print("Ora:", partita.get("time"))
              print("Casa:", partita.get("home"))
              print("Ospite:", partita.get("away"))
              print("Campo:", partita.get("field"))
              print("Indirizzo:", partita.get("fieldAddress"))
              print("Risultato:", partita.get("homeGoals"), "-", partita.get("awayGoals"))
              print("Giocata:", partita.get("isPlayed"))
              print("Riprogrammata:", partita.get("isRescheduled"))

          print()
          print("========================================")
          print("FINE ANALISI")
          print("========================================")
          PY
