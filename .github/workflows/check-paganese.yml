name: Controllo Paganese

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  controllo:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================

      - name: Scarica repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALLAZIONE STRUMENTI
      # ============================================================

      - name: Installa strumenti
        run: |
          sudo apt-get update
          sudo apt-get install -y lynx poppler-utils


      # ============================================================
      # 3. INIZIO CONTROLLO
      # ============================================================

      - name: Controllo calendario Paganese
        shell: bash
        run: |

          set -e

          echo "===================================="
          echo "CONTROLLO AUTOMATICO PAGANESE"
          echo "===================================="
          date -u

          echo ""
          echo "Scarico elenco comunicati Serie D..."
          
          lynx -dump -listonly \
            "https://comunicati.lnd.it/pages/comunicati?categoria=Interregionale" \
            > links.txt 2>/dev/null || true

          echo ""
          echo "Cerco PDF relativi a variazioni gare..."

          grep -i "variazioni.*\.pdf" links.txt \
            | sed -E 's/^[[:space:]]*[0-9]+\.[[:space:]]*//' \
            > variazioni.txt || true

          echo ""
          echo "PDF trovati:"

          cat variazioni.txt || true


          # ========================================================
          # 4. CONTROLLO CHE ESISTA IL CALENDARIO
          # ========================================================

          if [ ! -f "paganese.ics" ]; then
            echo ""
            echo "❌ ERRORE: paganese.ics non trovato."
            exit 1
          fi


          # ========================================================
          # 5. SCRIPT PYTHON DI ANALISI
          # ========================================================

          python3 <<'PY'

          import re
          import os
          import subprocess
          import unicodedata
          from datetime import datetime


          ICS_FILE = "paganese.ics"


          print("")
          print("====================================")
          print("LETTURA CALENDARIO PAGANESE")
          print("====================================")


          # --------------------------------------------------------
          # NORMALIZZAZIONE TESTO
          # --------------------------------------------------------

          def normalize(text):
              text = unicodedata.normalize("NFKD", text)
              text = "".join(
                  c for c in text
                  if not unicodedata.combining(c)
              )

              text = text.upper()

              text = text.replace("–", "-")
              text = text.replace("—", "-")
              text = text.replace("’", "'")

              text = re.sub(r"[^A-Z0-9]+", " ", text)
              text = re.sub(r"\s+", " ", text)

              return text.strip()


          # --------------------------------------------------------
          # LETTURA ICS
          # --------------------------------------------------------

          with open(ICS_FILE, "r", encoding="utf-8") as f:
              ics_text = f.read()


          # Gestione eventuale line wrapping ICS
          ics_unfolded = re.sub(r"\r?\n[ \t]", "", ics_text)


          events = re.findall(
              r"BEGIN:VEVENT(.*?)END:VEVENT",
              ics_unfolded,
              flags=re.S
          )


          partite = []


          for event in events:

              summary_match = re.search(
                  r"^SUMMARY:(.*)$",
                  event,
                  flags=re.M
              )

              dtstart_match = re.search(
                  r"^DTSTART(?:;[^:]*)?:(\d{8}T\d{4,6})(?:Z)?$",
                  event,
                  flags=re.M
              )

              dtend_match = re.search(
                  r"^DTEND(?:;[^:]*)?:(\d{8}T\d{4,6})(?:Z)?$",
                  event,
                  flags=re.M
              )

              if not summary_match:
                  continue

              summary = summary_match.group(1).strip()

              if not dtstart_match:
                  print(f"⚠️ DTSTART non trovato: {summary}")
                  continue

              dtstart_raw = dtstart_match.group(1)

              if len(dtstart_raw) == 13:
                  dtstart = datetime.strptime(
                      dtstart_raw,
                      "%Y%m%dT%H%M"
                  )
              else:
                  dtstart = datetime.strptime(
                      dtstart_raw,
                      "%Y%m%dT%H%M%S"
                  )

              # ----------------------------------------------------
              # Determina casa/trasferta
              # ----------------------------------------------------

              summary_norm = normalize(summary)

              if summary_norm.startswith("PAGANESE "):
                  ruolo = "CASA"
                  avversario = summary[len("Paganese - "):].strip()

              elif summary_norm.endswith(" PAGANESE"):
                  ruolo = "TRASFERTA"
                  avversario = re.sub(
                      r"\s*-\s*Paganese\s*$",
                      "",
                      summary,
                      flags=re.I
                  ).strip()

              else:
                  continue


              partite.append({
                  "summary": summary,
                  "avversario": avversario,
                  "avversario_norm": normalize(avversario),
                  "ruolo": ruolo,
                  "dtstart": dtstart,
                  "dtstart_raw": dtstart_raw,
                  "event": event
              })


          print("")
          print(f"PARTITE CARICATE: {len(partite)}")
          print("")


          if len(partite) != 34:
              print(
                  f"❌ ERRORE: attese 34 partite, "
                  f"trovate {len(partite)}"
              )
              exit(1)


          for p in partite:
              print(
                  f"- {p['dtstart'].strftime('%d/%m/%Y %H:%M')} | "
                  f"{p['summary']} | {p['ruolo']}"
              )


          # --------------------------------------------------------
          # FUNZIONE PER TROVARE UNA PARTITA
          # --------------------------------------------------------

          def trova_partita(line):

              line_norm = normalize(line)

              if "PAGANESE" not in line_norm:
                  return None

              for p in partite:

                  opponent_norm = p["avversario_norm"]

                  if not opponent_norm:
                      continue

                  if opponent_norm in line_norm:

                      return p

              return None


          # --------------------------------------------------------
          # FUNZIONI DATA / ORA
          # --------------------------------------------------------

          mesi = {
              "GENNAIO": 1,
              "FEBBRAIO": 2,
              "MARZO": 3,
              "APRILE": 4,
              "MAGGIO": 5,
              "GIUGNO": 6,
              "LUGLIO": 7,
              "AGOSTO": 8,
              "SETTEMBRE": 9,
              "OTTOBRE": 10,
              "NOVEMBRE": 11,
              "DICEMBRE": 12
          }


          date_pattern = re.compile(
              r"(?:"
              r"LUNEDI|LUNEDÌ|"
              r"MARTEDI|MARTEDÌ|"
              r"MERCOLEDI|MERCOLEDÌ|"
              r"GIOVEDI|GIOVEDÌ|"
              r"VENERDI|VENERDÌ|"
              r"SABATO|DOMENICA"
              r")"
              r"\s+"
              r"(\d{1,2})/(\d{1,2})/(\d{2,4})",
              re.I
          )


          time_pattern = re.compile(
              r"\b(?:ORE|ORA)\s+(\d{1,2})[,.](\d{2})",
              re.I
          )


          def parse_date(match):

              day = int(match.group(1))
              month = int(match.group(2))
              year = int(match.group(3))

              if year < 100:
                  year += 2000

              return datetime(
                  year,
                  month,
                  day
              ).date()


          # --------------------------------------------------------
          # SCARICA E ANALIZZA I PDF
          # --------------------------------------------------------

          with open("variazioni.txt", "r", encoding="utf-8") as f:
              pdf_urls = [
                  line.strip()
                  for line in f
                  if line.strip().startswith("http")
              ]


          print("")
          print("====================================")
          print(f"COMUNICATI DA ANALIZZARE: {len(pdf_urls)}")
          print("====================================")


          variazioni_trovate = []


          for index, url in enumerate(pdf_urls, start=1):

              print("")
              print("####################################")
              print(f"ANALISI COMUNICATO {index}")
              print("####################################")
              print(url)


              pdf_file = f"comunicato_{index}.pdf"
              txt_file = f"comunicato_{index}.txt"


              subprocess.run(
                  [
                      "curl",
                      "-L",
                      "-s",
                      "-o",
                      pdf_file,
                      url
                  ],
                  check=True
              )


              subprocess.run(
                  [
                      "pdftotext",
                      "-layout",
                      pdf_file,
                      txt_file
                  ],
                  check=True
              )


              with open(
                  txt_file,
                  "r",
                  encoding="utf-8",
                  errors="ignore"
              ) as f:
                  lines = f.readlines()


              # ----------------------------------------------------
              # Cerca le righe GARA contenenti PAGANESE
              # ----------------------------------------------------

              for i, line in enumerate(lines):

                  if "PAGANESE" not in normalize(line):
                      continue

                  if "GARA" not in normalize(line):
                      continue


                  partita = trova_partita(line)


                  # Se l'avversario non è tra le 34 partite
                  # di campionato, viene ignorato.
                  #
                  # Questo è ciò che ci permette di ignorare
                  # automaticamente Paganese-Palmese di Coppa Italia.

                  if partita is None:
                      continue


                  print("")
                  print("------------------------------------")
                  print("PARTITA TROVATA")
                  print("------------------------------------")
                  print(f"ICS : {partita['summary']}")
                  print(
                      "DATA: "
                      f"{partita['dtstart'].strftime('%d/%m/%Y')}"
                  )
                  print(
                      "ORA : "
                      f"{partita['dtstart'].strftime('%H:%M')}"
                  )


                  # ------------------------------------------------
                  # PRENDE IL BLOCCO DELLA GARA
                  # fino alla GARA successiva
                  # ------------------------------------------------

                  block_end = len(lines)

                  for j in range(i + 1, len(lines)):

                      if re.search(
                          r"\bGARA\s+\d+",
                          lines[j],
                          flags=re.I
                      ):
                          block_end = j
                          break


                  block = lines[i:block_end]

                  block_text = "".join(block)


                  # ------------------------------------------------
                  # ESTRAZIONE NUOVA DATA
                  # ------------------------------------------------

                  nuova_data = None

                  date_match = date_pattern.search(
                      block_text
                  )

                  if date_match:
                      try:
                          nuova_data = parse_date(
                              date_match
                          )
                      except ValueError:
                          nuova_data = None


                  # ------------------------------------------------
                  # ESTRAZIONE NUOVO ORARIO
                  # ------------------------------------------------

                  nuovo_orario = None

                  time_match = time_pattern.search(
                      block_text
                  )

                  if time_match:

                      ora = int(time_match.group(1))
                      minuti = int(time_match.group(2))

                      if 0 <= ora <= 23 and 0 <= minuti <= 59:
                          nuovo_orario = (
                              ora,
                              minuti
                          )


                  # ------------------------------------------------
                  # MOSTRA EVENTUALI INFORMAZIONI
                  # ------------------------------------------------

                  if nuova_data:
                      print(
                          "LND DATA : "
                          f"{nuova_data.strftime('%d/%m/%Y')}"
                      )
                  else:
                      print(
                          "LND DATA : "
                          "nessuna nuova data indicata"
                      )


                  if nuovo_orario:
                      print(
                          "LND ORA  : "
                          f"{nuovo_orario[0]:02d}:"
                          f"{nuovo_orario[1]:02d}"
                      )
                  else:
                      print(
                          "LND ORA  : "
                          "nessun nuovo orario indicato"
                      )


                  # ------------------------------------------------
                  # CONFRONTO
                  # ------------------------------------------------

                  cambio_data = (
                      nuova_data is not None
                      and nuova_data != partita["dtstart"].date()
                  )


                  cambio_orario = (
                      nuovo_orario is not None
                      and (
                          nuovo_orario[0]
                          != partita["dtstart"].hour
                          or
                          nuovo_orario[1]
                          != partita["dtstart"].minute
                      )
                  )


                  print("")


                  if cambio_data or cambio_orario:

                      print("⚠️ VARIAZIONE REALE RILEVATA")

                      if cambio_data:
                          print(
                              "   DATA DA CAMBIARE: "
                              f"{partita['dtstart'].strftime('%d/%m/%Y')}"
                              " → "
                              f"{nuova_data.strftime('%d/%m/%Y')}"
                          )

                      if cambio_orario:
                          print(
                              "   ORARIO DA CAMBIARE: "
                              f"{partita['dtstart'].strftime('%H:%M')}"
                              " → "
                              f"{nuovo_orario[0]:02d}:"
                              f"{nuovo_orario[1]:02d}"
                          )


                      variazioni_trovate.append({
                          "partita": partita,
                          "nuova_data": nuova_data,
                          "nuovo_orario": nuovo_orario
                      })

                  else:

                      print(
                          "✅ Nessuna modifica necessaria "
                          "per questa partita."
                      )


          # --------------------------------------------------------
          # RISULTATO FINALE
          # --------------------------------------------------------

          print("")
          print("====================================")
          print("RISULTATO FINALE")
          print("====================================")


          if variazioni_trovate:

              print("")
              print(
                  f"⚠️ VARIAZIONI REALI TROVATE: "
                  f"{len(variazioni_trovate)}"
              )

              for v in variazioni_trovate:

                  p = v["partita"]

                  print("")
                  print(f"PARTITA: {p['summary']}")

                  print(
                      "ATTUALE: "
                      f"{p['dtstart'].strftime('%d/%m/%Y %H:%M')}"
                  )

                  if v["nuova_data"]:
                      data_txt = v["nuova_data"].strftime(
                          "%d/%m/%Y"
                      )
                  else:
                      data_txt = p["dtstart"].strftime(
                          "%d/%m/%Y"
                      )

                  if v["nuovo_orario"]:
                      ora_txt = (
                          f"{v['nuovo_orario'][0]:02d}:"
                          f"{v['nuovo_orario'][1]:02d}"
                      )
                  else:
                      ora_txt = p["dtstart"].strftime(
                          "%H:%M"
                      )

                  print(
                      "NUOVA : "
                      f"{data_txt} {ora_txt}"
                  )

              print("")
              print(
                  "ℹ️ SIMULAZIONE: "
                  "il calendario NON è stato modificato."
              )

          else:

              print("")
              print("✅ Nessuna variazione trovata.")
              print("")
              print(
                  "Il calendario resta invariato."
              )


          print("")
          print("====================================")
          print("TEST COMPLETATO")
          print("CALENDARIO NON MODIFICATO")
          print("====================================")

          PY
