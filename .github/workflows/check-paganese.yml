name: Controllo Paganese

on:
  workflow_dispatch:

  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  controllo:
    runs-on: ubuntu-latest

    steps:

      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa strumenti
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lynx poppler-utils

      - name: Analizza variazioni delle partite
        run: |
          echo "======================================"
          echo "CONTROLLO AUTOMATICO PAGANESE"
          echo "======================================"
          date

          echo ""
          echo "Scarico elenco comunicati Serie D..."

          lynx -dump -listonly \
            "https://lnd.it/seried/comunicati/" \
            > links.txt

          echo ""
          echo "Cerco PDF relativi a variazioni gare..."

          grep -i "variazioni.*\.pdf" links.txt \
            | sed -E 's/^[[:space:]]*[0-9]+\.[[:space:]]*//' \
            > variazioni.txt || true

          echo ""
          echo "PDF trovati:"
          cat variazioni.txt || true

          python3 <<'PY'
          import re
          import subprocess
          import unicodedata
          from pathlib import Path
          from urllib.request import urlretrieve


          def normalizza(testo):
              testo = unicodedata.normalize("NFD", testo)

              testo = "".join(
                  c for c in testo
                  if unicodedata.category(c) != "Mn"
              )

              testo = testo.upper()
              testo = testo.replace("’", "'")
              testo = re.sub(r"[^A-Z0-9 ]", " ", testo)
              testo = re.sub(r"\s+", " ", testo).strip()

              return testo


          def formatta_data(data_ics):

              if not data_ics:
                  return "DATA NON TROVATA"

              match = re.match(
                  r"(\d{4})(\d{2})(\d{2})",
                  data_ics.strip()
              )

              if not match:
                  return data_ics

              return (
                  f"{match.group(3)}/"
                  f"{match.group(2)}/"
                  f"{match.group(1)}"
              )


          # ======================================
          # LETTURA CALENDARIO ICS
          # ======================================

          print("")
          print("======================================")
          print("LETTURA CALENDARIO PAGANESE")
          print("======================================")

          ics_path = Path("paganese.ics")

          if not ics_path.exists():
              print("ERRORE: paganese.ics non trovato!")
              raise SystemExit(1)

          contenuto = ics_path.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          contenuto = re.sub(
              r"\r?\n[ \t]",
              "",
              contenuto
          )

          eventi = re.findall(
              r"BEGIN:VEVENT(.*?)END:VEVENT",
              contenuto,
              re.DOTALL
          )

          partite = []


          # ======================================
          # PARTITE DAL CALENDARIO CAMPIONATO
          # ======================================

          for evento in eventi:

              summary_match = re.search(
                  r"^SUMMARY:(.+)$",
                  evento,
                  re.MULTILINE
              )

              dtstart_match = re.search(
                  r"^DTSTART[^:]*:(.+)$",
                  evento,
                  re.MULTILINE
              )

              if not summary_match:
                  continue

              summary = summary_match.group(1).strip()

              data_ics = (
                  dtstart_match.group(1).strip()
                  if dtstart_match
                  else ""
              )

              if " - " not in summary:
                  continue

              casa, trasferta = summary.split(" - ", 1)

              casa_norm = normalizza(casa)
              trasferta_norm = normalizza(trasferta)

              if casa_norm == "PAGANESE":

                  avversario = trasferta_norm
                  ruolo = "CASA"

              elif trasferta_norm == "PAGANESE":

                  avversario = casa_norm
                  ruolo = "TRASFERTA"

              else:
                  continue

              partite.append({
                  "summary": summary,
                  "avversario": avversario,
                  "ruolo": ruolo,
                  "data": formatta_data(data_ics),
                  "tipo": "CAMPIONATO"
              })


          # ======================================
          # PARTITA TEST: COPPA ITALIA
          # ======================================

          partite.append({
              "summary": "Paganese - Palmese",
              "avversario": "PALMESE",
              "ruolo": "CASA",
              "data": "30/08/2026",
              "tipo": "TEST COPPA ITALIA"
          })


          print("")
          print("PARTITE CARICATE:", len(partite))
          print("")

          for partita in partite:

              print(
                  f"- {partita['data']} | "
                  f"{partita['summary']} | "
                  f"{partita['ruolo']} | "
                  f"{partita['tipo']}"
              )


          # ======================================
          # URL COMUNICATI
          # ======================================

          variazioni_path = Path("variazioni.txt")

          urls = []

          if variazioni_path.exists():

              urls = [
                  riga.strip()
                  for riga in variazioni_path.read_text().splitlines()
                  if riga.strip().startswith("http")
              ]


          print("")
          print("======================================")
          print("COMUNICATI DA ANALIZZARE:", len(urls))
          print("======================================")


          risultati = []


          # ======================================
          # ANALISI PDF
          # ======================================

          for numero_pdf, url in enumerate(urls, 1):

              print("")
              print("######################################")
              print(f"ANALIZZO COMUNICATO {numero_pdf}")
              print("######################################")
              print(url)

              pdf = f"comunicato_{numero_pdf}.pdf"
              txt = f"comunicato_{numero_pdf}.txt"


              try:

                  urlretrieve(url, pdf)

                  subprocess.run(
                      [
                          "pdftotext",
                          "-layout",
                          pdf,
                          txt
                      ],
                      check=True,
                      capture_output=True
                  )

                  testo = Path(txt).read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )

              except Exception as errore:

                  print("")
                  print("ERRORE DURANTE LA LETTURA:")
                  print(errore)

                  continue


              righe = testo.splitlines()

              trovato_in_pdf = False


              # ======================================
              # CERCA PARTITE
              # ======================================

              for indice, riga in enumerate(righe):

                  riga_norm = normalizza(riga)

                  if "PAGANESE" not in riga_norm:
                      continue


                  for partita in partite:

                      avversario = partita["avversario"]

                      if avversario not in riga_norm:
                          continue


                      trovato_in_pdf = True


                      chiave = (
                          url,
                          partita["summary"],
                          indice
                      )


                      if any(
                          r["chiave"] == chiave
                          for r in risultati
                      ):
                          continue


                      risultati.append({
                          "chiave": chiave,
                          "partita": partita,
                          "url": url,
                          "indice": indice
                      })


                      print("")
                      print("🚨🚨🚨 PARTITA TROVATA 🚨🚨🚨")
                      print("")

                      print(
                          "PARTITA: "
                          + partita["summary"]
                      )

                      print(
                          "DATA: "
                          + partita["data"]
                      )

                      print(
                          "TIPO: "
                          + partita["tipo"]
                      )

                      print(
                          "RUOLO PAGANESE: "
                          + partita["ruolo"]
                      )


                      print("")
                      print("======================================")
                      print("CONTESTO COMPLETO DAL COMUNICATO")
                      print("======================================")


                      inizio = max(0, indice - 20)
                      fine = min(len(righe), indice + 25)


                      for numero_riga in range(inizio, fine):

                          marcatore = (
                              ">>>"
                              if numero_riga == indice
                              else "   "
                          )

                          print(
                              f"{marcatore} "
                              f"{numero_riga + 1:04d} | "
                              f"{righe[numero_riga]}"
                          )


                      print("======================================")
                      print("FINE CONTESTO")
                      print("======================================")


              if not trovato_in_pdf:

                  print("")
                  print(
                      "Nessuna partita monitorata "
                      "trovata in questo comunicato."
                  )


          # ======================================
          # RISULTATO FINALE
          # ======================================

          print("")
          print("======================================")
          print("RISULTATO FINALE CONTROLLO")
          print("======================================")

          if risultati:

              print("")
              print("🚨 PARTITE TROVATE NEI COMUNICATI:")
              print("")

              for risultato in risultati:

                  partita = risultato["partita"]

                  print(
                      f"- {partita['data']} | "
                      f"{partita['summary']} | "
                      f"{partita['tipo']}"
                  )

                  print(
                      f"  Fonte: {risultato['url']}"
                  )

          else:

              print("")
              print(
                  "✅ Nessuna partita monitorata "
                  "trovata nei comunicati."
              )


          print("")
          print("======================================")
          print("CONTROLLO TERMINATO")
          print("CALENDARIO NON MODIFICATO")
          print("======================================")

          PY
