name: Controllo Paganese

on:
  workflow_dispatch:

  schedule:
    - cron: "0 7 * * *"

jobs:
  controllo:
    runs-on: ubuntu-latest

    steps:
      - name: Installa strumenti
        run: |
          sudo apt-get update
          sudo apt-get install -y lynx

      - name: Cerca comunicati con variazioni
        run: |
          echo "======================================"
          echo "CONTROLLO AUTOMATICO PAGANESE"
          echo "======================================"
          date

          echo ""
          echo "Cerco comunicati LND contenenti VARIAZIONI..."
          echo ""

          lynx -dump \
            "https://lnd.it/seried/comunicati/" \
            | grep -i "variazioni" || true

          echo ""
          echo "======================================"
          echo "CONTROLLO COMPLETATO"
          echo "======================================"
