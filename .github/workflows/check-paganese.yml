name: Studio calendario completo LND

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  aggiorna-calendario:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Estrai calendario LND e genera ICS
        run: |
          cat > estrai_calendario.py <<'PYTHON'
          import json
          import re
          import urllib.request
          from datetime import datetime, timedelta
          from pathlib import Path

          BASE_URL = (
              "https://gare.lnd.it/competizione/"
              "dipartimento-interregionale"
              "?campionato=ID"
              "&giornata={giornata}"
              "&girone=G"
              "&leg={leg}"
              "&stagione=2026"
          )

          SQUADRA = "Paganese"

          def scarica_pagina(url):
              richiesta = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": (
                          "Mozilla/5.0 "
                          "(X11; Linux x86_64) "
                          "AppleWebKit/537.36 "
                          "Chrome/131 Safari/537.36"
                      )
                  },
              )

              with urllib.request.urlopen(
                  richiesta,
                  timeout=30
              ) as risposta:
                  return risposta.read().decode(
                      "utf-8",
                      errors="replace"
                  )

          def estrai_partite(html):
              pattern = re.compile(
                  r'"matches"\s*:\s*(\[[\s\S]*?\])\s*[,}]'
              )

              for script in re.findall(
                  r"<script[^>]*>([\s\S]*?)</script>",
                  html,
                  flags=re.IGNORECASE,
              ):
                  if '"matches"' not in script:
                      continue

                  match = pattern.search(script)

                  if not match:
                      continue

                  try:
                      partite = json.loads(match.group(1))

                      if isinstance(partite, list):
                          return partite

                  except json.JSONDecodeError:
                      continue

              return []

          def valore(partita, *chiavi):
              for chiave in chiavi:
                  if chiave in partita:
                      return partita[chiave]

              return ""

          def normalizza(testo):
              return re.sub(
                  r"\s+",
                  " ",
                  str(testo or "").strip().lower()
              )

          def chiave_univoca(partita):
              identificativo = valore(
                  partita,
                  "id",
                  "match_id",
                  "matchId",
                  "gara_id",
                  "garaId",
              )

              if identificativo:
                  return f"id:{identificativo}"

              data = valore(
                  partita,
                  "date",
                  "data",
                  "match_date",
                  "matchDate",
                  "datetime",
                  "dateTime",
              )

              casa = nome_squadra(partita, "casa")
              trasferta = nome_squadra(partita, "trasferta")

              return (
                  f"fallback:"
                  f"{normalizza(data)}|"
                  f"{normalizza(casa)}|"
                  f"{normalizza(trasferta)}"
              )

          def estrai_nome(valore_originale):
              if isinstance(valore_originale, str):
                  return valore_originale

              if isinstance(valore_originale, dict):
                  for chiave in (
                      "name",
                      "nome",
                      "team_name",
                      "teamName",
                      "club_name",
                      "clubName",
                      "denominazione",
                      "description",
                  ):
                      if valore_originale.get(chiave):
                          return str(valore_originale[chiave])

              return str(valore_originale or "")

          def nome_squadra(partita, lato):
              if lato == "casa":
                  chiavi = (
                      "home",
                      "home_team",
                      "homeTeam",
                      "squadra_casa",
                      "squadraCasa",
                      "team_home",
                      "teamHome",
                      "local",
                      "localTeam",
                  )
              else:
                  chiavi = (
                      "away",
                      "away_team",
                      "awayTeam",
                      "squadra_trasferta",
                      "squadraTrasferta",
                      "team_away",
                      "teamAway",
                      "visitor",
                      "visitorTeam",
                      "ospite",
                  )

              risultato = valore(partita, *chiavi)

              return estrai_nome(risultato)

          def partita_paganese(partita):
              casa = normalizza(nome_squadra(partita, "casa"))
              trasferta = normalizza(nome_squadra(partita, "trasferta"))

              return (
                  "paganese" in casa
                  or "paganese" in trasferta
              )

          def data_partita(partita):
              data = valore(
                  partita,
                  "date",
                  "data",
                  "match_date",
                  "matchDate",
                  "datetime",
                  "dateTime",
                  "startDate",
                  "start_date",
              )

              if isinstance(data, dict):
                  data = (
                      data.get("date")
                      or data.get("value")
                      or data.get("datetime")
                      or data.get("dateTime")
                      or ""
                  )

              return str(data or "").strip()

          def id_partita(partita):
              return str(
                  valore(
                      partita,
                      "id",
                      "match_id",
                      "matchId",
                      "gara_id",
                      "garaId",
                  )
                  or ""
              )

          def parse_data(data):
              """
              Converte i principali formati restituiti dal sito
              in una data Python.
              """

              testo = str(data or "").strip()

              if not testo:
                  return None

              # ISO completo: 2026-09-06T15:00:00
              match = re.search(
                  r"(20\d{2})-(\d{2})-(\d{2})",
                  testo
              )

              if match:
                  anno, mese, giorno = map(
                      int,
                      match.groups()
                  )

                  return datetime(
                      anno,
                      mese,
                      giorno
                  )

              # Formato italiano: 06/09/2026
              match = re.search(
                  r"(\d{2})/(\d{2})/(20\d{2})",
                  testo
              )

              if match:
                  giorno, mese, anno = map(
                      int,
                      match.groups()
                  )

                  return datetime(
                      anno,
                      mese,
                      giorno
                  )

              return None

          def escape_ics(testo):
              """
              Escape obbligatorio per il formato ICS.
              """

              testo = str(testo or "")

              return (
                  testo
                  .replace("\\", "\\\\")
                  .replace(";", "\\;")
                  .replace(",", "\\,")
                  .replace("\r\n", "\\n")
                  .replace("\n", "\\n")
                  .replace("\r", "\\n")
              )

          def crea_ics(partite):
              righe = [
                  "BEGIN:VCALENDAR",
                  "VERSION:2.0",
                  "PRODID:-//Paganese Calendar//IT",
                  "CALSCALE:GREGORIAN",
                  "METHOD:PUBLISH",
                  "X-WR-CALNAME:Paganese Calcio 1926",
                  "X-WR-TIMEZONE:Europe/Rome",
              ]

              generati = 0

              for partita in partite:
                  data_originale = data_partita(partita)
                  data = parse_data(data_originale)

                  if data is None:
                      print(
                          "ATTENZIONE: data non riconosciuta per "
                          f"{partita}"
                      )
                      continue

                  casa = nome_squadra(partita, "casa")
                  trasferta = nome_squadra(partita, "trasferta")
                  identificativo = id_partita(partita)

                  if not casa:
                      casa = "Squadra di casa"

                  if not trasferta:
                      trasferta = "Squadra ospite"

                  if identificativo:
                      uid = (
                          f"{identificativo}"
                          "@paganese-calendar.github"
                      )
                  else:
                      uid = (
                          f"{data.strftime('%Y%m%d')}-"
                          f"{normalizza(casa)}-"
                          f"{normalizza(trasferta)}"
                          "@paganese-calendar.github"
                      )

                  giorno_inizio = data.strftime("%Y%m%d")
                  giorno_fine = (
                      data + timedelta(days=1)
                  ).strftime("%Y%m%d")

                  descrizione = (
                      f"{casa} - {trasferta}\\n"
                      f"Calendario Paganese Calcio 1926"
                  )

                  righe.extend([
                      "BEGIN:VEVENT",
                      f"UID:{escape_ics(uid)}",
                      f"DTSTAMP:{datetime.utcnow().strftime('%Y%m%dT%H%M%SZ')}",
                      f"DTSTART;VALUE=DATE:{giorno_inizio}",
                      f"DTEND;VALUE=DATE:{giorno_fine}",
                      f"SUMMARY:{escape_ics(casa + ' - ' + trasferta)}",
                      f"DESCRIPTION:{escape_ics(descrizione)}",
                      "STATUS:CONFIRMED",
                      "TRANSP:TRANSPARENT",
                      "END:VEVENT",
                  ])

                  generati += 1

              righe.append("END:VCALENDAR")

              return "\r\n".join(righe) + "\r\n", generati

          tutte_le_partite = {}

          configurazioni = [
              ("andata", "first"),
              ("ritorno", "second"),
          ]

          for nome_leg, valore_leg in configurazioni:
              print("")
              print("=" * 70)
              print(
                  f"LETTURA {nome_leg.upper()} "
                  f"- parametro leg={valore_leg}"
              )
              print("=" * 70)

              for giornata in range(1, 18):
                  url = BASE_URL.format(
                      giornata=giornata,
                      leg=valore_leg,
                  )

                  try:
                      html = scarica_pagina(url)
                      partite = estrai_partite(html)

                      print(
                          f"{nome_leg.capitalize()} "
                          f"giornata {giornata}: "
                          f"partite trovate = {len(partite)}"
                      )

                      nuove = 0
                      duplicate = 0

                      for partita in partite:
                          chiave = chiave_univoca(partita)

                          if chiave in tutte_le_partite:
                              duplicate += 1
                              continue

                          partita["_leg"] = nome_leg
                          partita["_giornata_pagina"] = giornata

                          tutte_le_partite[chiave] = partita
                          nuove += 1

                      print(
                          f"  Nuove: {nuove} | "
                          f"Duplicate: {duplicate}"
                      )

                  except Exception as errore:
                      print(
                          f"ERRORE {nome_leg} giornata {giornata}: "
                          f"{errore}"
                      )

          partite_uniche = list(tutte_le_partite.values())

          partite_paganese = [
              partita
              for partita in partite_uniche
              if partita_paganese(partita)
          ]

          partite_paganese.sort(
              key=lambda partita: (
                  data_partita(partita),
                  id_partita(partita),
              )
          )

          print("")
          print("=" * 70)
          print("RISULTATO FINALE")
          print("=" * 70)
          print(
              f"Partite uniche raccolte: "
              f"{len(partite_uniche)}"
          )
          print(
              f"Partite Paganese: "
              f"{len(partite_paganese)}"
          )
          print("")

          for indice, partita in enumerate(
              partite_paganese,
              start=1
          ):
              print(
                  f"{indice:02d}. "
                  f"{data_partita(partita)} | "
                  f"{nome_squadra(partita, 'casa')} - "
                  f"{nome_squadra(partita, 'trasferta')} | "
                  f"ID: {id_partita(partita)} | "
                  f"Pagina: {partita.get('_leg')} "
                  f"{partita.get('_giornata_pagina')}"
              )

          Path("partite_lnd.json").write_text(
              json.dumps(
                  partite_uniche,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          Path("partite_paganese.json").write_text(
              json.dumps(
                  partite_paganese,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          calendario_ics, eventi_generati = crea_ics(
              partite_paganese
          )

          Path("paganese.ics").write_text(
              calendario_ics,
              encoding="utf-8",
              newline="",
          )

          print("")
          print("=" * 70)
          print("GENERAZIONE CALENDARIO ICS")
          print("=" * 70)
          print(
              f"Eventi ICS generati: {eventi_generati}"
          )

          if len(partite_paganese) != 34:
              print("")
              print(
                  "ATTENZIONE: il numero di partite Paganese "
                  f"è {len(partite_paganese)}, non 34."
              )
          elif eventi_generati != 34:
              print("")
              print(
                  "ATTENZIONE: sono state trovate 34 partite, "
                  f"ma generati soltanto {eventi_generati} eventi ICS."
              )
          else:
              print("")
              print(
                  "OK: trovate 34 partite Paganese "
                  "e generati 34 eventi ICS."
              )
          PYTHON

          python estrai_calendario.py

      - name: Controlla file generati
        run: |
          echo "File generati:"
          ls -lah \
            partite_lnd.json \
            partite_paganese.json \
            paganese.ics

          echo ""
          echo "Prime righe del calendario ICS:"
          head -n 20 paganese.ics

      - name: Commit dei risultati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            partite_lnd.json \
            partite_paganese.json \
            paganese.ics

          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Aggiorna calendario Paganese"
            git push
          fi
