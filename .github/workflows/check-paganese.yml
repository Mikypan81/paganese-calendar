name: Controllo Paganese

on:
  workflow_dispatch:

  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  controllo:
    runs-on: ubuntu-latest

    steps:

      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa strumenti
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lynx poppler-utils

      - name: Analizza variazioni Paganese
        run: |

          echo "======================================"
          echo "CONTROLLO AUTOMATICO PAGANESE"
          echo "======================================"
          date


          # ======================================
          # SCARICA COMUNICATI
          # ======================================

          echo ""
          echo "Scarico elenco comunicati Serie D..."

          lynx -dump -listonly \
            "https://lnd.it/seried/comunicati/" \
            > links.txt


          echo ""
          echo "Cerco PDF relativi a variazioni gare..."

          grep -i "variazioni.*\.pdf" links.txt \
            | sed -E 's/^[[:space:]]*[0-9]+\.[[:space:]]*//' \
            > variazioni.txt || true


          echo ""
          echo "PDF trovati:"

          cat variazioni.txt || true


          # ======================================
          # PYTHON
          # ======================================

          python3 <<'PY'

          import re
          import subprocess
          import unicodedata

          from pathlib import Path
          from urllib.request import urlretrieve


          # ======================================
          # NORMALIZZAZIONE TESTO
          # ======================================

          def normalizza(testo):

              testo = unicodedata.normalize(
                  "NFD",
                  testo
              )

              testo = "".join(
                  c
                  for c in testo
                  if unicodedata.category(c) != "Mn"
              )

              testo = testo.upper()

              testo = testo.replace("’", "'")

              testo = re.sub(
                  r"[^A-Z0-9 ]",
                  " ",
                  testo
              )

              testo = re.sub(
                  r"\s+",
                  " ",
                  testo
              ).strip()

              return testo


          # ======================================
          # DATA ICS → DATA LEGGIBILE
          # ======================================

          def formatta_data(data):

              if not data:
                  return "NON DISPONIBILE"

              match = re.match(
                  r"(\d{4})(\d{2})(\d{2})",
                  data
              )

              if not match:
                  return data

              return (
                  f"{match.group(3)}/"
                  f"{match.group(2)}/"
                  f"{match.group(1)}"
              )


          # ======================================
          # ESTRAE DATA DA UNA RIGA DEL PDF
          # ======================================

          def estrai_data(riga):

              match = re.search(
                  r"(?:SABATO|DOMENICA|VENERDI|VENERDÌ|"
                  r"GIOVEDI|GIOVEDÌ|MERCOLEDI|MERCOLEDÌ|"
                  r"MARTEDI|MARTEDÌ|LUNEDI|LUNEDÌ)"
                  r"\s+(\d{1,2})/(\d{1,2})/(\d{2,4})",
                  riga.upper()
              )

              if not match:
                  return None

              giorno = int(match.group(1))
              mese = int(match.group(2))
              anno = int(match.group(3))

              if anno < 100:
                  anno += 2000

              return (
                  f"{anno:04d}"
                  f"{mese:02d}"
                  f"{giorno:02d}"
              )


          # ======================================
          # ESTRAE ORA DA UNA RIGA DEL PDF
          # ======================================

          def estrai_ora(riga):

              match = re.search(
                  r"(?:ORE|ORA)\s+"
                  r"(\d{1,2})[,.](\d{2})",
                  riga.upper()
              )

              if not match:
                  return None

              ora = int(match.group(1))
              minuti = int(match.group(2))

              return f"{ora:02d}:{minuti:02d}"


          # ======================================
          # LEGGE ICS
          # ======================================

          print("")
          print("======================================")
          print("LETTURA CALENDARIO PAGANESE")
          print("======================================")


          ics_path = Path("paganese.ics")


          if not ics_path.exists():

              print(
                  "ERRORE: paganese.ics non trovato!"
              )

              raise SystemExit(1)


          contenuto = ics_path.read_text(
              encoding="utf-8",
              errors="ignore"
          )


          # Unisce eventuali righe ICS continuate
          contenuto = re.sub(
              r"\r?\n[ \t]",
              "",
              contenuto
          )


          eventi = re.findall(
              r"BEGIN:VEVENT(.*?)END:VEVENT",
              contenuto,
              re.DOTALL
          )


          partite = []


          for evento in eventi:

              summary_match = re.search(
                  r"^SUMMARY:(.+)$",
                  evento,
                  re.MULTILINE
              )


              dtstart_match = re.search(
                  r"^DTSTART[^:]*:(.+)$",
                  evento,
                  re.MULTILINE
              )


              if not summary_match:
                  continue


              summary = summary_match.group(1).strip()


              data_ics = ""

              if dtstart_match:

                  data_ics = (
                      dtstart_match.group(1).strip()
                  )


              if " - " not in summary:
                  continue


              casa, trasferta = summary.split(
                  " - ",
                  1
              )


              casa_norm = normalizza(casa)
              trasferta_norm = normalizza(trasferta)


              if casa_norm == "PAGANESE":

                  avversario = trasferta_norm
                  ruolo = "CASA"

              elif trasferta_norm == "PAGANESE":

                  avversario = casa_norm
                  ruolo = "TRASFERTA"

              else:

                  continue


              partite.append({

                  "summary": summary,

                  "avversario": avversario,

                  "ruolo": ruolo,

                  "data_ics": data_ics,

                  "data": formatta_data(data_ics)

              })


          print("")
          print(
              "PARTITE CARICATE:",
              len(partite)
          )

          print("")


          for partita in partite:

              print(
                  f"- {partita['data']} | "
                  f"{partita['summary']} | "
                  f"{partita['ruolo']}"
              )


          # ======================================
          # COMUNICATI
          # ======================================

          variazioni_path = Path(
              "variazioni.txt"
          )


          urls = []


          if variazioni_path.exists():

              urls = [

                  riga.strip()

                  for riga in
                  variazioni_path.read_text().splitlines()

                  if riga.strip().startswith("http")

              ]


          print("")
          print("======================================")
          print(
              "COMUNICATI DA ANALIZZARE:",
              len(urls)
          )
          print("======================================")


          variazioni_trovate = []


          # ======================================
          # ANALIZZA OGNI PDF
          # ======================================

          for numero_pdf, url in enumerate(
              urls,
              1
          ):

              print("")
              print(
                  "######################################"
              )

              print(
                  f"ANALIZZO COMUNICATO {numero_pdf}"
              )

              print(
                  "######################################"
              )

              print(url)


              pdf = (
                  f"comunicato_{numero_pdf}.pdf"
              )

              txt = (
                  f"comunicato_{numero_pdf}.txt"
              )


              try:

                  urlretrieve(
                      url,
                      pdf
                  )


                  subprocess.run(

                      [
                          "pdftotext",
                          "-layout",
                          pdf,
                          txt
                      ],

                      check=True,

                      capture_output=True

                  )


                  testo = Path(
                      txt
                  ).read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )


              except Exception as errore:

                  print("")
                  print(
                      "ERRORE LETTURA PDF:"
                  )

                  print(errore)

                  continue


              righe = testo.splitlines()


              # ==================================
              # CERCA LE PARTITE
              # ==================================

              for indice, riga in enumerate(
                  righe
              ):


                  riga_norm = normalizza(
                      riga
                  )


                  if "PAGANESE" not in riga_norm:
                      continue


                  for partita in partite:


                      if (
                          partita["avversario"]
                          not in riga_norm
                      ):

                          continue


                      print("")
                      print(
                          "🚨🚨🚨 PARTITA TROVATA 🚨🚨🚨"
                      )

                      print("")

                      print(
                          "PARTITA:"
                      )

                      print(
                          partita["summary"]
                      )

                      print(
                          "DATA ATTUALE:"
                      )

                      print(
                          partita["data"]
                      )


                      # ==========================
                      # CERCA FINO ALLA GARA
                      # SUCCESSIVA
                      # ==========================

                      fine_blocco = len(
                          righe
                      )


                      for j in range(
                          indice + 1,
                          len(righe)
                      ):

                          if re.search(
                              r"\bGARA\s+\d+",
                              righe[j],
                              re.IGNORECASE
                          ):

                              fine_blocco = j

                              break


                      blocco = righe[
                          indice:fine_blocco
                      ]


                      # ==========================
                      # ESTRAI DATA E ORA
                      # ==========================

                      nuova_data = None
                      nuova_ora = None
                      nuovo_campo = None


                      for riga_blocco in blocco:


                          if nuova_data is None:

                              data_trovata = (
                                  estrai_data(
                                      riga_blocco
                                  )
                              )

                              if data_trovata:

                                  nuova_data = (
                                      data_trovata
                                  )


                          if nuova_ora is None:

                              ora_trovata = (
                                  estrai_ora(
                                      riga_blocco
                                  )
                              )

                              if ora_trovata:

                                  nuova_ora = (
                                      ora_trovata
                                  )


                          riga_lower = (
                              riga_blocco.lower()
                          )


                          if (
                              "campo " in riga_lower
                              or "stadio " in riga_lower
                              or "comunale " in riga_lower
                          ):

                              testo_campo = (
                                  riga_blocco.strip()
                              )

                              if testo_campo:

                                  nuovo_campo = (
                                      testo_campo
                                  )


                      # ==========================
                      # RISULTATO PARSING
                      # ==========================

                      print("")
                      print(
                          "---------- VARIAZIONE LETTA ----------"
                      )


                      if nuova_data:

                          print(
                              "NUOVA DATA:",
                              formatta_data(
                                  nuova_data
                              )
                          )

                      else:

                          print(
                              "NUOVA DATA: "
                              "nessuna indicata"
                          )


                      if nuova_ora:

                          print(
                              "NUOVO ORARIO:",
                              nuova_ora
                          )

                      else:

                          print(
                              "NUOVO ORARIO: "
                              "nessuno indicato"
                          )


                      if nuovo_campo:

                          print(
                              "CAMPO:",
                              nuovo_campo
                          )

                      else:

                          print(
                              "CAMPO: "
                              "nessuna variazione indicata"
                          )


                      print(
                          "--------------------------------------"
                      )


                      # ==========================
                      # CONFRONTO
                      # ==========================

                      print("")
                      print(
                          "CONFRONTO CON CALENDARIO:"
                      )


                      if nuova_data:

                          data_attuale = (
                              partita["data_ics"]
                          )

                          if (
                              nuova_data
                              != data_attuale
                          ):

                              print(
                                  "⚠️ DATA DA CAMBIARE"
                              )

                          else:

                              print(
                                  "✅ DATA INVARIATA"
                              )


                      if nuova_ora:

                          print(
                              "⚠️ ORARIO DA VERIFICARE:",
                              nuova_ora
                          )

                      else:

                          print(
                              "✅ NESSUN CAMBIO ORARIO"
                          )


                      print("")
                      print(
                          "---------- BLOCCO ORIGINALE ----------"
                      )


                      for riga_blocco in blocco:

                          print(
                              riga_blocco
                          )


                      print(
                          "--------------------------------------"
                      )


                      variazioni_trovate.append({

                          "partita":
                              partita["summary"],

                          "data_attuale":
                              partita["data"],

                          "nuova_data":
                              nuova_data,

                          "nuova_ora":
                              nuova_ora,

                          "campo":
                              nuovo_campo,

                          "fonte":
                              url

                      })


          # ======================================
          # RISULTATO FINALE
          # ======================================

          print("")
          print("======================================")
          print("RISULTATO FINALE")
          print("======================================")


          if variazioni_trovate:

              print("")

              print(
                  "🚨 VARIAZIONI INDIVIDUATE:"
              )

              print("")


              for variazione in (
                  variazioni_trovate
              ):

                  print(
                      "PARTITA:",
                      variazione["partita"]
                  )

                  print(
                      "DATA ATTUALE:",
                      variazione["data_attuale"]
                  )

                  print(
                      "NUOVA DATA:",
                      variazione["nuova_data"]
                      or "invariata"
                  )

                  print(
                      "NUOVO ORARIO:",
                      variazione["nuova_ora"]
                      or "invariato"
                  )

                  print(
                      "FONTE:",
                      variazione["fonte"]
                  )

                  print("")


          else:

              print("")
              print(
                  "✅ Nessuna variazione trovata."
              )


          print(
              "======================================"
          )

          print(
              "TEST COMPLETATO"
          )

          print(
              "CALENDARIO NON MODIFICATO"
          )

          print(
              "======================================"

          )

          PY
