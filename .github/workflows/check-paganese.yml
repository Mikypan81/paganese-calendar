name: Controllo Paganese

on:
  workflow_dispatch:

  schedule:
    - cron: "0 7 * * *"

jobs:
  controllo:
    runs-on: ubuntu-latest

    steps:
      - name: Controlla i comunicati Serie D
        run: |
          echo "======================================"
          echo "CONTROLLO AUTOMATICO PAGANESE"
          echo "Data controllo:"
          date
          echo "======================================"

          echo ""
          echo "Scarico pagina comunicati ufficiali Serie D..."

          curl -L -s https://lnd.it/seried/comunicati/ > comunicati.html

          echo ""
          echo "Cerco riferimenti alla Paganese..."

          if grep -i -q "Paganese" comunicati.html; then
            echo "ATTENZIONE: trovato riferimento alla Paganese!"
          else
            echo "Nessun riferimento diretto alla Paganese nella pagina."
          fi

          echo ""
          echo "Controllo completato."
