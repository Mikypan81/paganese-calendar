name: Studio dati pagina LND

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analisi-pagina:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa strumenti
        run: |
          sudo apt-get update
          sudo apt-get install -y curl python3

      - name: Scarica pagina ufficiale
        run: |
          set -e

          URL="https://gare.lnd.it/competizione/dipartimento-interregionale?campionato=ID&giornata=2&girone=G&leg=first&stagione=2026"

          echo "===================================="
          echo "SCARICO PAGINA UFFICIALE LND"
          echo "===================================="

          echo "URL:"
          echo "$URL"

          curl -L -sS \
            -A "Mozilla/5.0" \
            "$URL" \
            -o pagina.html

          echo
          echo "Dimensione pagina:"
          wc -c pagina.html

      - name: Cerca squadre e dati nel codice HTML
        run: |
          set -e

          echo
          echo "===================================="
          echo "RICERCA PAGANESE E SASSARI"
          echo "===================================="

          echo
          echo "--- OCCORRENZE PAGANESE ---"
          grep -oi -C 8 "paganese" pagina.html | head -200 || true

          echo
          echo "--- OCCORRENZE SASSARI ---"
          grep -oi -C 8 "sassari" pagina.html | head -200 || true

          echo
          echo "--- OCCORRENZE LATTE DOLCE ---"
          grep -oi -C 8 "latte dolce" pagina.html | head -200 || true

          echo
          echo "--- OCCORRENZE MATCHES ---"
          grep -oi -C 5 "matches" pagina.html | head -100 || true

          echo
          echo "--- OCCORRENZE MATCHDAY ---"
          grep -oi -C 5 "matchday" pagina.html | head -100 || true

      - name: Estrai e stampa tutte le partite
        run: |
          set -e

          echo
          echo "========================================"
          echo "ESTRAZIONE DI TUTTE LE PARTITE"
          echo "========================================"

          python3 - <<'PY'
          import html
          import json
          import re
          from pathlib import Path

          pagina = Path("pagina.html").read_text(
              encoding="utf-8",
              errors="ignore"
          )

          print(f"Numero caratteri HTML: {len(pagina)}")

          scripts = re.findall(
              r"<script\b[^>]*>(.*?)</script>",
              pagina,
              flags=re.IGNORECASE | re.DOTALL
          )

          print(f"Script trovati: {len(scripts)}")

          def pulisci_testo(testo):
              testo = html.unescape(testo)
              testo = testo.replace("\\/", "/")
              testo = testo.replace("\\u0022", '"')
              testo = testo.replace("\\u0027", "'")
              return testo

          def cerca_matches(valore, percorso="root", profondita=0):
              """
              Cerca ricorsivamente tutte le chiavi chiamate matches.
              """
              risultati = []

              if profondita > 12:
                  return risultati

              if isinstance(valore, dict):
                  for chiave, contenuto in valore.items():
                      nuovo_percorso = f"{percorso}.{chiave}"

                      if str(chiave).lower() == "matches":
                          risultati.append(
                              (nuovo_percorso, contenuto)
                          )

                      risultati.extend(
                          cerca_matches(
                              contenuto,
                              nuovo_percorso,
                              profondita + 1
                          )
                      )

              elif isinstance(valore, list):
                  for indice, contenuto in enumerate(valore):
                      risultati.extend(
                          cerca_matches(
                              contenuto,
                              f"{percorso}[{indice}]",
                              profondita + 1
                          )
                      )

              return risultati

          def estrai_json_da_script(testo):
              """
              Prova a estrarre un oggetto JSON completo
              anche quando lo script contiene altro codice.
              """
              testo = pulisci_testo(testo)

              decoder = json.JSONDecoder()

              posizioni = [
                  posizione
                  for posizione, carattere in enumerate(testo)
                  if carattere in "{["
              ]

              for posizione in posizioni:
                  candidato = testo[posizione:].strip()

                  try:
                      oggetto, caratteri_letti = decoder.raw_decode(
                          candidato
                      )

                      return oggetto

                  except Exception:
                      continue

              return None

          json_trovati = []

          for numero_script, contenuto_script in enumerate(
              scripts,
              start=1
          ):
              testo = pulisci_testo(contenuto_script)

              parole_interessanti = [
                  "matches",
                  "paganese",
                  "sassari",
                  "latte dolce",
                  "matchday",
                  "calendar"
              ]

              if not any(
                  parola.lower() in testo.lower()
                  for parola in parole_interessanti
              ):
                  continue

              print()
              print("----------------------------------------")
              print(f"ANALIZZO SCRIPT NUMERO {numero_script}")
              print("----------------------------------------")

              oggetto = estrai_json_da_script(testo)

              if oggetto is None:
                  print("Nessun JSON estraibile in questo script.")
                  continue

              json_trovati.append(oggetto)

              risultati_matches = cerca_matches(oggetto)

              if not risultati_matches:
                  print("Nessuna chiave 'matches' trovata.")
                  continue

              for percorso, matches in risultati_matches:
                  print()
                  print("========================================")
                  print("ARRAY PARTITE TROVATO")
                  print("Percorso:", percorso)
                  print("========================================")

                  if not isinstance(matches, list):
                      print("Il valore trovato non è una lista.")
                      print(repr(matches)[:5000])
                      continue

                  print("Numero partite:", len(matches))
                  print()

                  for indice, partita in enumerate(matches, start=1):
                      print("----------------------------------------")
                      print(f"PARTITA {indice}")
                      print("----------------------------------------")

                      if isinstance(partita, dict):
                          data = partita.get("date")
                          casa = partita.get("home")
                          ospite = partita.get("away")
                          gol_casa = partita.get("homeGoals")
                          gol_ospite = partita.get("awayGoals")

                          print("Data:", data)
                          print("Casa:", casa)
                          print("Ospite:", ospite)
                          print("Gol casa:", gol_casa)
                          print("Gol ospite:", gol_ospite)

                          print()
                          print("Dati completi della partita:")

                          print(
                              json.dumps(
                                  partita,
                                  ensure_ascii=False,
                                  indent=2
                              )
                          )

                      else:
                          print(
                              json.dumps(
                                  partita,
                                  ensure_ascii=False,
                                  indent=2
                              )
                          )

          print()
          print("========================================")
          print("FINE ESTRAZIONE PARTITE")
          print("========================================")
          PY

      - name: Mostra fine analisi
        run: |
          echo
          echo "========================================"
          echo "FINE ANALISI"
          echo "========================================"
